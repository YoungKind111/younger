<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>注册成为氧阁推广 - 护理招募</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #ff4d8f, #ff1a6c); min-height: 100vh; color: #262626; -webkit-tap-highlight-color: transparent; }
    #app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 40px 24px 24px; text-align: center; color: #fff; }
    .header-icon { font-size: 56px; margin-bottom: 12px; }
    .header-title { font-size: 22px; font-weight: 600; }
    .header-sub { font-size: 14px; opacity: 0.9; margin-top: 6px; }
    .form-card { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 24px 40px; flex: 1; }
    .form-title { font-size: 18px; font-weight: 600; margin-bottom: 24px; }
    .input-group { margin-bottom: 20px; }
    .input-label { font-size: 14px; color: #595959; margin-bottom: 8px; display: block; }
    .input-label .required { color: #ff4d4f; margin-left: 2px; }
    .input-field { width: 100%; padding: 14px 16px; border: 1px solid #d9d9d9; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.3s; }
    .input-field:focus { border-color: #ff4d8f; }
    .input-field::placeholder { color: #bfbfbf; }
    .input-row { display: flex; gap: 12px; }
    .input-row .input-field { flex: 1; }
    .btn-code { padding: 14px 16px; border: 1px solid #ff4d8f; color: #ff4d8f; background: #fff; border-radius: 10px; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .btn-code:disabled { border-color: #d9d9d9; color: #bfbfbf; }
    .btn-primary { width: 100%; padding: 16px; background: #ff4d8f; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary:disabled { background: #ffccc7; }
    .agree-wrap { display: flex; align-items: flex-start; gap: 8px; margin-top: 20px; font-size: 13px; color: #8c8c8c; line-height: 1.6; }
    .agree-wrap input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; accent-color: #ff4d8f; cursor: pointer; flex-shrink: 0; }
    .agree-wrap a { color: #ff4d8f; text-decoration: none; }
    .success-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .success-card { background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center; width: 100%; max-width: 320px; }
    .success-icon { width: 64px; height: 64px; background: #f6ffed; color: #52c41a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; }
    .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .success-desc { font-size: 14px; color: #595959; margin-bottom: 20px; }
    .invite-code { background: #f5f5f5; border-radius: 8px; padding: 12px; font-size: 24px; font-weight: 700; color: #ff4d8f; letter-spacing: 4px; margin-bottom: 20px; }
    .success-btn { width: 100%; padding: 14px; background: #ff4d8f; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-icon">🤝</div>
      <div class="header-title">加入氧阁推广计划</div>
      <div class="header-sub">推荐月嫂/护理人员，赚取佣金奖励</div>
    </div>

    <div class="form-card">
      <div class="form-title">填写基本信息</div>

      <div class="input-group">
        <label class="input-label">手机号<span class="required">*</span></label>
        <input class="input-field" v-model="form.phone" type="tel" placeholder="请输入手机号" maxlength="11" />
      </div>

      <div class="input-group">
        <label class="input-label">验证码<span class="required">*</span></label>
        <div class="input-row">
          <input class="input-field" v-model="form.code" placeholder="请输入验证码" maxlength="6" />
          <button class="btn-code" :disabled="codeTimer > 0" @click="sendCode">{{ codeTimer > 0 ? codeTimer + 's' : '获取验证码' }}</button>
        </div>
      </div>

      <button class="btn-primary" :disabled="!canSubmit" @click="submit">立即注册</button>

      <div class="agree-wrap">
        <input type="checkbox" id="agree" v-model="form.agreeProtocol" />
        <label for="agree">我已阅读并同意<a href="#">《推广协议》</a>和<a href="#">《服务条款》</a></label>
      </div>
    </div>

    <!-- 注册成功弹窗 -->
    <div v-if="showSuccess" class="success-overlay">
      <div class="success-card">
        <div class="success-icon">✓</div>
        <div class="success-title">注册成功</div>
        <button class="success-btn" @click="goToCenter">进入推广中心</button>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;
    createApp({
      setup() {
        const form = ref({ phone: '', code: '', agreeProtocol: false });
        const codeTimer = ref(0);
        const showSuccess = ref(false);
        const generatedCode = ref('');

        const canSubmit = computed(() => {
          return form.value.agreeProtocol && /^1[3-9]\d{9}$/.test(form.value.phone) && form.value.code.length === 6;
        });

        const sendCode = () => {
          if (!/^1[3-9]\d{9}$/.test(form.value.phone)) {
            alert('请输入正确的手机号');
            return;
          }
          codeTimer.value = 60;
          const timer = setInterval(() => {
            codeTimer.value--;
            if (codeTimer.value <= 0) clearInterval(timer);
          }, 1000);
          alert('验证码已发送：123456');
        };

        const submit = () => {
          generatedCode.value = 'PRO' + Math.random().toString(36).substring(2, 6).toUpperCase();
          localStorage.setItem('promoter_logged_in', '1');
          showSuccess.value = true;
        };

        const goToCenter = () => {
          window.location.href = 'h5-center.html';
        };

        return { form, codeTimer, showSuccess, generatedCode, canSubmit, sendCode, submit, goToCenter };
      }
    }).mount('#app');
  </script>
</body>
</html>
