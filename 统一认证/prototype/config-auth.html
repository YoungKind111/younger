<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认证源清单 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref } = Vue;

    SharedMenu.initPageLayout('config-auth', { title: '认证源清单' });

    SharedMenu.createVueApp({
      template: `
        <div class="content-card">
          <div class="card-header"><span class="card-title">各端登录方式清单（只读）</span></div>
          <div class="card-body">
            <el-alert type="info" :closable="false" style="margin-bottom:14px;"
              title="各端启用的登录方式在端开发接入时确定，本页只读展示，供管理员与客服排障查阅；启停或新增登录方式属端开发（二期再评估运营启停开关）。"></el-alert>
            <el-table :data="channels" style="width: 100%">
              <el-table-column prop="name" label="端" width="180">
                <template #default="{ row }">
                  <div>{{ row.name }}</div>
                  <code style="font-size:11px;color:#909399;">{{ row.channel }}</code>
                </template>
              </el-table-column>
              <el-table-column label="微信 code" width="120" align="center">
                <template #default="{ row }"><el-tag size="small" :type="tagType(row.caps.includes('wechat'))">{{ tagText(row.caps.includes('wechat')) }}</el-tag></template>
              </el-table-column>
              <el-table-column label="手机验证码" width="120" align="center">
                <template #default="{ row }"><el-tag size="small" :type="tagType(row.caps.includes('sms'))">{{ tagText(row.caps.includes('sms')) }}</el-tag></template>
              </el-table-column>
              <el-table-column label="账号密码" width="120" align="center">
                <template #default="{ row }"><el-tag size="small" :type="tagType(row.caps.includes('password'))">{{ tagText(row.caps.includes('password')) }}</el-tag></template>
              </el-table-column>
              <el-table-column label="企微扫码" width="120" align="center">
                <template #default="{ row }"><el-tag size="small" :type="tagType(row.caps.includes('wework'))">{{ tagText(row.caps.includes('wework')) }}</el-tag></template>
              </el-table-column>
              <el-table-column label="一键登录（二期）" align="center">
                <template #default><el-tag size="small" type="info">未接入</el-tag></template>
              </el-table-column>
            </el-table>
          </div>
        </div>
      `,
      setup() {
        // caps = 该端接入时声明并启用的登录方式集合（只读事实）
        const channels = ref([
          { name: '客户端小程序', channel: 'client_mini', caps: ['wechat', 'sms'] },
          { name: '客户端 APP', channel: 'client_app', caps: ['wechat', 'sms'] },
          { name: '月嫂端小程序', channel: 'worker_mini', caps: ['wechat', 'sms'] },
          { name: '月嫂端 APP', channel: 'worker_app', caps: ['wechat', 'sms'] },
          { name: '月嫂招聘小程序', channel: 'recruit_mini', caps: ['wechat', 'sms'] },
          { name: '内部员工端小程序', channel: 'staff_mini', caps: ['wechat', 'sms', 'password'] },
          { name: '业务管理后台', channel: 'admin_web', caps: ['password', 'wework'] },
          { name: 'SCRM', channel: 'scrm_web', caps: ['password', 'wework'] }
        ]);

        const tagType = (on) => on ? 'success' : 'info';
        const tagText = (on) => on ? '启用' : '未接入';

        return { channels, tagType, tagText };
      }
    }).mount('#app');
  </script>
</body>
</html>
