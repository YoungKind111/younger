<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .login-card { width: 400px; background: #fff; border-radius: 10px; padding: 32px 36px 28px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .login-logo { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-sub { text-align: center; font-size: 12px; color: #909399; margin-bottom: 22px; }
    .qr-box { width: 200px; height: 200px; margin: 8px auto 14px; border: 1px solid #ebeef5; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #909399; font-size: 13px; }
    .qr-grid { width: 140px; height: 140px; background: repeating-conic-gradient(#1f2d3d 0 25%, #fff 0 50%) 0 0/20px 20px; border-radius: 4px; opacity: .85; }
  </style>
</head>
<body>
  <!-- proto:no-layout -->
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref } = Vue;

    // 登录页不使用后台布局，仅用 createVueApp 保证组件与中文包一致
    SharedMenu.createVueApp({
      template: `
        <div class="login-card">
          <div class="login-logo">统一管理后台</div>
          <div class="login-sub">统一认证中心 · 账号密码 / 企微扫码</div>

          <el-tabs v-model="tab" stretch>
            <el-tab-pane label="账号密码" name="pwd">
              <el-form :model="form" style="margin-top:14px;">
                <el-form-item>
                  <el-input v-model="form.username" placeholder="用户名">
                    <template #prefix><el-icon><User /></el-icon></template>
                  </el-input>
                </el-form-item>
                <el-form-item>
                  <el-input v-model="form.password" type="password" show-password placeholder="密码">
                    <template #prefix><el-icon><Lock /></el-icon></template>
                  </el-input>
                </el-form-item>
                <el-button type="primary" style="width:100%;" @click="login">登 录</el-button>
                <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:13px;">
                  <el-button link type="primary" @click="forgot">忘记密码</el-button>
                  <span style="color:#909399;">连续失败 5 次锁定 30 分钟</span>
                </div>
              </el-form>
            </el-tab-pane>

            <el-tab-pane label="企微扫码" name="wework">
              <div class="qr-box">
                <div class="qr-grid"></div>
                <span>打开企业微信扫码登录</span>
              </div>
              <div style="text-align:center;font-size:12px;color:#909399;">
                扫码后在企业微信内确认；memberid 将匹配在职员工档案
              </div>
              <div style="text-align:center;margin-top:14px;">
                <el-button size="small" @click="mockScan">模拟扫码成功</el-button>
              </div>
            </el-tab-pane>
          </el-tabs>
        </div>
      `,
      setup() {
        const tab = ref('pwd');
        const form = ref({ username: '', password: '' });

        const login = () => {
          if (!form.value.username || !form.value.password) {
            ElementPlus.ElMessage.warning('请输入用户名和密码');
            return;
          }
          window.location.href = 'index.html';
        };

        const forgot = () => {
          ElementPlus.ElMessage.info('演示：跳转找回密码流程（手机号验证 → 设置新密码 → 全端重登）');
        };

        const mockScan = () => {
          ElementPlus.ElMessage.success('企微确认成功，正在登录…');
          setTimeout(() => { window.location.href = 'index.html'; }, 600);
        };

        return { tab, form, login, forgot, mockScan };
      }
    }).mount('#app');
  </script>
</body>
</html>
