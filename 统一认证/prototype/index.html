<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .nav-card { background: #fff; border-radius: 8px; padding: 18px 20px; cursor: pointer; transition: box-shadow .2s; }
    .nav-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .nav-card h3 { font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .nav-card p { font-size: 12px; color: #909399; line-height: 1.7; }
    @media (max-width: 900px) { .nav-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref } = Vue;

    SharedMenu.initPageLayout('', { title: '统一管理后台 · 首页' });

    SharedMenu.createVueApp({
      template: `
        <div>
          <div class="grid-4 mb-2">
            <div class="stat-card" v-for="c in statCards" :key="c.title" style="cursor:pointer;" @click="go(c.url)">
              <div class="stat-header">
                <span class="stat-title">{{ c.title }}</span>
                <div class="stat-icon" :class="c.color"><el-icon :size="20"><component :is="c.icon" /></el-icon></div>
              </div>
              <div class="stat-value">{{ c.value }}</div>
            </div>
          </div>

          <div class="nav-grid">
            <div class="nav-card" v-for="m in modules" :key="m.title" @click="go(m.url)">
              <h3><el-icon :size="18" :color="m.color"><component :is="m.icon" /></el-icon>{{ m.title }}</h3>
              <p>{{ m.desc }}</p>
            </div>
          </div>
        </div>
      `,
      setup() {
        const statCards = ref([
          { title: '在职员工', value: 246, icon: 'User', color: 'blue', url: 'staff-list.html' },
          { title: '接入系统', value: 3, icon: 'Grid', color: 'green', url: 'system-access.html' },
          { title: '今日登录人次', value: 189, icon: 'DataLine', color: 'orange', url: 'audit-log.html' },
          { title: '今日禁用操作', value: 3, icon: 'Lock', color: 'red', url: 'audit-log.html' }
        ]);

        const modules = ref([
          { title: '组织架构', desc: '部门树管理，数据范围「本部门/及下级」的事实源', icon: 'OfficeBuilding', color: '#1890ff', url: 'org-tree.html' },
          { title: '员工管理', desc: '员工开通（邀请制）、调岗、离职三连联动', icon: 'User', color: '#1890ff', url: 'staff-list.html' },
          { title: '角色管理', desc: '角色增删改、复制；权限矩阵双视图配置', icon: 'Avatar', color: '#52c41a', url: 'role-list.html' },
          { title: '权限点清单', desc: '各系统注册的权限点总表，按系统分组', icon: 'Key', color: '#52c41a', url: 'perm-points.html' },
          { title: '系统接入', desc: '业务系统接入向导：登记 → manifest → 发布', icon: 'Connection', color: '#52c41a', url: 'system-access.html' },
          { title: '账号查询', desc: '手机号/openid/ID 查账号状态、绑定主体、登录记录', icon: 'UserFilled', color: '#fa8c16', url: 'account-search.html' },
          { title: '账号统计', desc: '账号总量、主体分布、状态分布、各端登录与新增趋势', icon: 'DataLine', color: '#fa8c16', url: 'account-stats.html' },
          { title: '全局配置', desc: '认证源 / 安全策略 / 端与准入', icon: 'Setting', color: '#722ed1', url: 'config-auth.html' },
          { title: '审计查询', desc: '认证与权限操作留痕，组合筛选 + 导出', icon: 'Document', color: '#722ed1', url: 'audit-log.html' },
          { title: '个人中心', desc: '修改密码、登录设备管理', icon: 'User', color: '#722ed1', url: 'profile.html' }
        ]);

        const go = (url) => { window.location.href = url; };

        return { statCards, modules, go };
      }
    }).mount('#app');
  </script>
</body>
</html>
