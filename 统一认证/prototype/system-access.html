<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统接入管理 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref, computed } = Vue;

    SharedMenu.initPageLayout('system-access', { title: '系统接入管理' });

    SharedMenu.createVueApp({
      template: `
        <div>
          <!-- 统计卡片 -->
          <div class="grid-4 mb-2">
            <div class="stat-card" v-for="c in statCards" :key="c.title">
              <div class="stat-header">
                <span class="stat-title">{{ c.title }}</span>
                <div class="stat-icon" :class="c.color"><el-icon :size="20"><component :is="c.icon" /></el-icon></div>
              </div>
              <div class="stat-value">{{ c.value }}</div>
            </div>
          </div>

          <div class="content-card">
            <div class="card-header">
              <span class="card-title">接入系统</span>
              <el-button type="primary" size="small" @click="openWizard">
                <el-icon><Plus /></el-icon> 接入新系统
              </el-button>
            </div>
            <div class="card-body">
              <el-table :data="systemsData" style="width: 100%">
                <el-table-column prop="name" label="系统" width="130"></el-table-column>
                <el-table-column prop="code" label="编码" width="110">
                  <template #default="{ row }"><code style="font-size:12px;">{{ row.code }}</code></template>
                </el-table-column>
                <el-table-column prop="owner" label="负责人" width="90"></el-table-column>
                <el-table-column label="接入方式" width="130">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.mode === '存量盘点' ? 'warning' : 'success'">{{ row.mode }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="permCount" label="权限点数" width="90"></el-table-column>
                <el-table-column prop="manifest" label="manifest 版本" width="120"></el-table-column>
                <el-table-column prop="syncTime" label="最近同步" width="150"></el-table-column>
                <el-table-column label="状态" width="90">
                  <template #default="{ row }">
                    <el-tag :type="row.status === '已接入' ? 'success' : 'info'" size="small">{{ row.status }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column label="操作" width="170">
                  <template #default="{ row }">
                    <el-button link type="primary" @click="resync(row)">重新同步</el-button>
                    <el-button link type="warning" @click="showDeprecated(row)">废弃点({{ row.deprecated }})</el-button>
                  </template>
                </el-table-column>
              </el-table>
            </div>
          </div>

          <!-- 接入向导 -->
          <el-dialog v-model="wizardVisible" title="接入新系统" width="640px">
            <el-steps :active="step" align-center finish-status="success" style="margin-bottom:24px;">
              <el-step title="系统登记"></el-step>
              <el-step title="manifest 导入"></el-step>
              <el-step title="发布生效"></el-step>
            </el-steps>

            <div v-if="step === 0">
              <el-form :model="wizardForm" label-width="100px">
                <el-form-item label="系统名称"><el-input v-model="wizardForm.name" placeholder="如：SCRM"></el-input></el-form-item>
                <el-form-item label="系统编码"><el-input v-model="wizardForm.code" placeholder="如：scrm（权限点命名空间前缀）"></el-input></el-form-item>
                <el-form-item label="负责人"><el-input v-model="wizardForm.owner"></el-input></el-form-item>
                <el-form-item label="接入方式">
                  <el-radio-group v-model="wizardForm.mode">
                    <el-radio value="new">新系统（代码注解扫描）</el-radio>
                    <el-radio value="legacy">存量系统（盘点确认 manifest 导入）</el-radio>
                  </el-radio-group>
                </el-form-item>
              </el-form>
            </div>
            <div v-else-if="step === 1">
              <el-alert type="info" :closable="false" style="margin-bottom:12px;"
                :title="wizardForm.mode === 'new' ? '新系统：构建时自动扫描代码注解生成 manifest，此处预览扫描结果。' : '存量系统：导入盘点业务确认后的 manifest（不导入旧 manage 通配权限）。'">
              </el-alert>
              <el-table :data="manifestPreview" size="small" max-height="260">
                <el-table-column prop="page" label="页面/页签" width="160"></el-table-column>
                <el-table-column prop="acts" label="动作"></el-table-column>
                <el-table-column prop="type" label="类型" width="80">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.type === '页面' ? 'info' : 'warning'">{{ row.type }}</el-tag>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <div v-else>
              <el-result icon="success" title="manifest 校验通过"
                :sub-title="'共 ' + manifestPreview.length + ' 个权限点；发布后进入权限点清单，可在角色配置中勾选使用。'">
              </el-result>
            </div>

            <template #footer>
              <el-button v-if="step > 0" @click="step--">上一步</el-button>
              <el-button @click="wizardVisible = false">取消</el-button>
              <el-button v-if="step < 2" type="primary" @click="nextStep">下一步</el-button>
              <el-button v-else type="success" @click="publishWizard">发布生效</el-button>
            </template>
          </el-dialog>
        </div>
      `,
      setup() {
        const statCards = ref([
          { title: '已接入系统', value: 3, icon: 'Grid', color: 'blue' },
          { title: '权限点总数', value: 168, icon: 'Key', color: 'green' },
          { title: '待处理废弃点', value: 1, icon: 'Warning', color: 'orange' },
          { title: '今日同步次数', value: 2, icon: 'Refresh', color: 'red' }
        ]);

        const systemsData = ref([
          { name: 'ERP', code: 'erp', owner: '张工', mode: '存量盘点', permCount: 132, manifest: 'v1.4.0', syncTime: '2026-08-25 09:05', status: '已接入', deprecated: 1 },
          { name: 'SCRM', code: 'scrm', owner: '李工', mode: '代码注解', permCount: 24, manifest: 'v0.3.1', syncTime: '2026-08-26 16:40', status: '已接入', deprecated: 0 },
          { name: '统一认证中心', code: 'account', owner: '王工', mode: '代码注解', permCount: 12, manifest: 'v1.0.0', syncTime: '2026-08-20 10:12', status: '已接入', deprecated: 0 }
        ]);

        // ==================== 接入向导 ====================
        const wizardVisible = ref(false);
        const step = ref(0);
        const wizardForm = ref({ name: '', code: '', owner: '', mode: 'new' });
        // manifest 预览随接入方式切换：新系统=代码注解扫描结果；存量=盘点业务确认结果（不含旧 manage 通配）
        const manifestNew = [
          { page: '线索管理', acts: '查看 / 跟进 / 分配 / 导出', type: '页面' },
          { page: '⧨ 介绍人员', acts: '查看 / 新增 / 编辑 / 停用', type: '页签' },
          { page: '客户管理', acts: '查看 / 跟进 / 转让', type: '页面' },
          { page: '会话存档', acts: '查看', type: '页面' },
          { page: '统计分析', acts: '查看 / 导出', type: '页面' }
        ];
        const manifestLegacy = [
          { page: '线索管理', acts: '查看 / 新增 / 编辑 / 领取 / 分配 / 跟进 / 转化 / 作废 / 导出', type: '页面' },
          { page: '客户管理', acts: '查看 / 新增 / 编辑 / 跟进 / 转移 / 匹配 / 作废 / 导出', type: '页面' },
          { page: '工资账单', acts: '查看 / 生成 / 销售确认 / 客服核对 / 薪酬审核 / 发放 / 导出', type: '页面' },
          { page: '⧨ 退款审核', acts: '查看 / 审核通过 / 驳回 / 确认退款 / 导出', type: '页签' }
        ];
        const manifestPreview = computed(() => wizardForm.value.mode === 'new' ? manifestNew : manifestLegacy);

        const openWizard = () => {
          wizardForm.value = { name: '', code: '', owner: '', mode: 'new' };
          step.value = 0;
          wizardVisible.value = true;
        };
        const nextStep = () => {
          if (step.value === 0 && (!wizardForm.value.name || !wizardForm.value.code)) {
            ElementPlus.ElMessage.warning('请填写系统名称与编码');
            return;
          }
          step.value++;
        };
        const publishWizard = () => {
          wizardVisible.value = false;
          ElementPlus.ElMessage.success(`系统「${wizardForm.value.name}」已接入：权限点进入清单，可在角色配置中使用`);
        };

        const resync = (row) => {
          ElementPlus.ElMessage.success(`已触发「${row.name}」注册表同步（通常随系统发版自动完成）`);
        };
        const showDeprecated = (row) => {
          if (!row.deprecated) { ElementPlus.ElMessage.info('无废弃权限点'); return; }
          ElementPlus.ElMessageBox.alert(
            'order:export（订单导出·旧）——仍被角色「运营」引用，请先在角色中移除后再下线。',
            `废弃权限点 · ${row.name}`, { confirmButtonText: '知道了' }
          );
        };

        return {
          statCards, systemsData,
          wizardVisible, step, wizardForm, manifestPreview,
          openWizard, nextStep, publishWizard, resync, showDeprecated
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
