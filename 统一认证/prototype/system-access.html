<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统接入管理 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref, computed } = Vue;

    SharedMenu.initPageLayout('system-access', { title: '系统接入管理' });

    SharedMenu.createVueApp({
      template: `
        <div>
          <!-- 统计卡片 -->
          <div class="grid-4 mb-2">
            <div class="stat-card" v-for="c in statCards" :key="c.title">
              <div class="stat-header">
                <span class="stat-title">{{ c.title }}</span>
                <div class="stat-icon" :class="c.color"><el-icon :size="20"><component :is="c.icon" /></el-icon></div>
              </div>
              <div class="stat-value">{{ c.value }}</div>
            </div>
          </div>

          <div class="content-card">
            <div class="card-header">
              <span class="card-title">接入系统（只读）</span>
            </div>
            <div class="card-body">
              <el-table :data="systemsData" style="width: 100%">
                <el-table-column prop="name" label="系统" width="130"></el-table-column>
                <el-table-column prop="code" label="编码" width="110">
                  <template #default="{ row }"><code style="font-size:12px;">{{ row.code }}</code></template>
                </el-table-column>
                <el-table-column prop="owner" label="负责人" width="90"></el-table-column>
                <el-table-column label="接入方式" width="130">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.mode === '存量盘点' ? 'warning' : 'success'">{{ row.mode }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="permCount" label="权限点数" width="90"></el-table-column>
                <el-table-column prop="syncTime" label="最近同步" width="150"></el-table-column>
                <el-table-column label="状态" width="90">
                  <template #default="{ row }">
                    <el-tag :type="row.status === '已接入' ? 'success' : 'info'" size="small">{{ row.status }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column label="操作" width="170">
                  <template #default="{ row }">
                    <el-button link type="primary" @click="resync(row)">重新同步</el-button>
                    <el-button link type="warning" @click="showDeprecated(row)">废弃点({{ row.deprecated }})</el-button>
                  </template>
                </el-table-column>
              </el-table>
            </div>
          </div>
        </div>
      `,
      setup() {
        const statCards = ref([
          { title: '已接入系统', value: 3, icon: 'Grid', color: 'blue' },
          { title: '权限点总数', value: 168, icon: 'Key', color: 'green' },
          { title: '待处理废弃点', value: 1, icon: 'Warning', color: 'orange' },
          { title: '今日同步次数', value: 2, icon: 'Refresh', color: 'red' }
        ]);

        const systemsData = ref([
          { name: 'ERP', code: 'erp', owner: '张工', mode: '存量盘点', permCount: 132, syncTime: '2026-08-25 09:05', status: '已接入', deprecated: 1 },
          { name: 'SCRM', code: 'scrm', owner: '李工', mode: '代码注解', permCount: 24, syncTime: '2026-08-26 16:40', status: '已接入', deprecated: 0 },
          { name: '统一认证中心', code: 'account', owner: '王工', mode: '代码注解', permCount: 12, syncTime: '2026-08-20 10:12', status: '已接入', deprecated: 0 }
        ]);


        const resync = (row) => {
          ElementPlus.ElMessage.success(`已触发「${row.name}」注册表同步（通常随系统发版自动完成）`);
        };
        const showDeprecated = (row) => {
          if (!row.deprecated) { ElementPlus.ElMessage.info('无废弃权限点'); return; }
          ElementPlus.ElMessageBox.alert(
            'order:export（订单导出·旧）——仍被角色「运营」引用，请先在角色中移除后再下线。',
            `废弃权限点 · ${row.name}`, { confirmButtonText: '知道了' }
          );
        };

        return {
          statCards, systemsData, resync, showDeprecated
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
