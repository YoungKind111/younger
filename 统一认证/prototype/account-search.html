<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号查询 - 统一管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { ref } = Vue;

    SharedMenu.initPageLayout('account', { title: '账号查询' });

    SharedMenu.createVueApp({
      template: `
        <div>
          <!-- 搜索区 -->
          <div class="content-card mb-2">
            <div class="card-body">
              <div class="filter-bar" style="margin-bottom:0;">
                <el-radio-group v-model="queryBy">
                  <el-radio value="phone">手机号</el-radio>
                  <el-radio value="openid">openid</el-radio>
                  <el-radio value="id">账号 ID</el-radio>
                </el-radio-group>
                <el-input v-model="keyword" :placeholder="'输入' + queryLabel" style="width: 280px">
                  <template #prefix><el-icon><Search /></el-icon></template>
                </el-input>
                <el-button type="primary" @click="doQuery">查询</el-button>
              </div>
            </div>
          </div>

          <div v-if="result">
            <!-- 账号信息 + 操作 -->
            <div class="content-card mb-2">
              <div class="card-header">
                <span class="card-title">
                  账号 {{ result.id }}
                  <el-tag :type="result.status === '正常' ? 'success' : 'danger'" size="small" style="margin-left:8px;">{{ result.status }}</el-tag>
                </span>
                <div>
                  <el-button size="small" type="danger" plain @click="disableVisible = true">
                    {{ result.status === '正常' ? '禁用' : '启用' }}
                  </el-button>
                  <el-button size="small" @click="resetVisible = true">凭证重置</el-button>
                </div>
              </div>
              <div class="card-body">
                <el-descriptions :column="3" border size="small">
                  <el-descriptions-item label="手机号">138****2046</el-descriptions-item>
                  <el-descriptions-item label="登录方式">微信 / 手机验证码 / 密码</el-descriptions-item>
                  <el-descriptions-item label="unionid">o6_bm****8e3c</el-descriptions-item>
                  <el-descriptions-item label="注册来源">无感知注册（客户端小程序）</el-descriptions-item>
                  <el-descriptions-item label="创建时间">2024-03-18 11:30</el-descriptions-item>
                  <el-descriptions-item label="最近登录">2026-08-27 09:12</el-descriptions-item>
                </el-descriptions>
              </div>
            </div>

            <!-- 绑定主体 -->
            <div class="content-card mb-2">
              <div class="card-header"><span class="card-title">绑定主体（2）</span></div>
              <div class="card-body">
                <el-table :data="result.parties" size="small">
                  <el-table-column prop="type" label="主体类型" width="120">
                    <template #default="{ row }">
                      <el-tag size="small" :type="{ customer: 'primary', worker: 'success', staff: 'warning' }[row.type]">{{ row.type }}</el-tag>
                    </template>
                  </el-table-column>
                  <el-table-column prop="name" label="主体" width="140"></el-table-column>
                  <el-table-column prop="bindType" label="绑定方式" width="140"></el-table-column>
                  <el-table-column prop="bindTime" label="绑定时间" width="160"></el-table-column>
                  <el-table-column prop="status" label="主体状态">
                    <template #default="{ row }">
                      <el-tag size="small" :type="row.status === '正常' ? 'success' : 'danger'">{{ row.status }}</el-tag>
                    </template>
                  </el-table-column>
                </el-table>
              </div>
            </div>

            <!-- 最近登录 -->
            <div class="content-card">
              <div class="card-header"><span class="card-title">最近 10 条登录记录</span></div>
              <div class="card-body">
                <el-table :data="result.logins" size="small">
                  <el-table-column prop="time" label="时间" width="160"></el-table-column>
                  <el-table-column prop="channel" label="端" width="160"></el-table-column>
                  <el-table-column prop="ip" label="IP" width="140"></el-table-column>
                  <el-table-column prop="result" label="结果">
                    <template #default="{ row }">
                      <el-tag size="small" :type="row.result === '成功' ? 'success' : 'danger'">{{ row.result }}</el-tag>
                    </template>
                  </el-table-column>
                </el-table>
              </div>
            </div>
          </div>

          <div v-else class="content-card">
            <div class="card-body" style="color:#909399;text-align:center;padding:48px 0;">
              输入手机号 / openid / 账号 ID 查询（演示：输入任意内容点击查询）
            </div>
          </div>

          <!-- 禁用对话框（两级封禁 + 二次验证） -->
          <el-dialog v-model="disableVisible" title="禁用账号（两级封禁）" width="480px">
            <el-form label-width="90px">
              <el-form-item label="封禁级别">
                <el-radio-group v-model="disableForm.level">
                  <el-radio value="party">封主体（单一身份失效）</el-radio>
                  <el-radio value="account">封账号（全部身份失效）</el-radio>
                </el-radio-group>
              </el-form-item>
              <el-form-item label="选择主体" v-if="disableForm.level === 'party'">
                <el-select v-model="disableForm.party" style="width:100%">
                  <el-option label="customer（家庭客户）" value="customer"></el-option>
                  <el-option label="staff（内部员工）" value="staff"></el-option>
                </el-select>
              </el-form-item>
              <el-form-item label="禁用原因">
                <el-input v-model="disableForm.reason" type="textarea" :rows="2" placeholder="必填，写入审计日志"></el-input>
              </el-form-item>
              <el-form-item label="二次验证">
                <el-input v-model="disableForm.code" placeholder="输入操作人短信验证码（演示：任意 6 位）"></el-input>
              </el-form-item>
            </el-form>
            <template #footer>
              <el-button @click="disableVisible = false">取消</el-button>
              <el-button type="danger" @click="confirmDisable">确认禁用</el-button>
            </template>
          </el-dialog>

          <!-- 凭证重置对话框 -->
          <el-dialog v-model="resetVisible" title="凭证重置" width="440px">
            <el-radio-group v-model="resetType" style="margin-bottom:14px;">
              <el-radio value="sms">临时密码（短信下发）</el-radio>
              <el-radio value="link">重置链接</el-radio>
            </el-radio-group>
            <el-alert type="info" :closable="false"
              title="临时凭证一次性、限时有效；使用后强制进入改密页；该账号既有 token 全部吊销。"></el-alert>
            <template #footer>
              <el-button @click="resetVisible = false">取消</el-button>
              <el-button type="primary" @click="confirmReset">执行重置</el-button>
            </template>
          </el-dialog>
        </div>
      `,
      setup() {
        const queryBy = ref('phone');
        const keyword = ref('');
        const queryLabel = ref('手机号');
        Vue.watch(queryBy, (v) => {
          queryLabel.value = { phone: '手机号', openid: 'openid', id: '账号 ID' }[v];
        });

        // ==================== Mock 查询结果 ====================
        const result = ref(null);
        const doQuery = () => {
          result.value = {
            id: 'ACC-10086', status: '正常',
            parties: [
              { type: 'customer', name: '刘倩（客户）', bindType: '手机号匹配', bindTime: '2024-03-18 11:30', status: '正常' },
              { type: 'staff', name: '刘倩（员工）', bindType: '邀请绑定', bindTime: '2024-03-20 09:00', status: '正常' }
            ],
            logins: [
              { time: '2026-08-27 09:12', channel: '业务管理后台', ip: '112.96.33.18', result: '成功' },
              { time: '2026-08-26 18:40', channel: '客户端小程序', ip: '112.96.33.18', result: '成功' },
              { time: '2026-08-26 09:03', channel: '业务管理后台', ip: '112.96.33.18', result: '成功' },
              { time: '2026-08-25 22:17', channel: '客户端小程序', ip: '223.104.64.9', result: '失败（验证码错误）' },
              { time: '2026-08-25 11:08', channel: '月嫂端小程序', ip: '223.104.64.9', result: '成功' },
              { time: '2026-08-24 17:55', channel: '客户端小程序', ip: '120.229.88.4', result: '失败（账号锁定中）' },
              { time: '2026-08-24 09:31', channel: '业务管理后台', ip: '112.96.33.18', result: '成功' },
              { time: '2026-08-23 20:14', channel: '客户端小程序', ip: '112.96.33.18', result: '成功' },
              { time: '2026-08-23 08:52', channel: '月嫂端小程序', ip: '223.104.64.9', result: '成功' },
              { time: '2026-08-22 13:27', channel: '客户端小程序', ip: '112.96.33.18', result: '成功' }
            ]
          };
          ElementPlus.ElMessage.success('查询完成（查询行为已写入审计日志）');
        };

        // ==================== 禁用 ====================
        const disableVisible = ref(false);
        const disableForm = ref({ level: 'account', party: '', reason: '', code: '' });
        const confirmDisable = () => {
          if (!disableForm.value.reason) { ElementPlus.ElMessage.warning('禁用原因必填'); return; }
          if (!disableForm.value.code || disableForm.value.code.length !== 6) { ElementPlus.ElMessage.warning('请输入 6 位二次验证码'); return; }
          disableVisible.value = false;
          result.value.status = '已禁用';
          ElementPlus.ElMessage.success('已禁用：≤5 秒全端 token 失效，操作已留审计');
        };

        // ==================== 凭证重置 ====================
        const resetVisible = ref(false);
        const resetType = ref('sms');
        const confirmReset = () => {
          resetVisible.value = false;
          ElementPlus.ElMessage.success('临时密码已短信下发；既有 token 已全部吊销');
        };

        // URL 参数指定账号（从其他页面跳入时自动查询）
        const urlId = new URLSearchParams(window.location.search).get('id');
        if (urlId) { keyword.value = urlId; doQuery(); }

        return {
          queryBy, keyword, queryLabel, result, doQuery,
          disableVisible, disableForm, confirmDisable,
          resetVisible, resetType, confirmReset
        };
      }
    }).mount('#app');
  </script></body>
</html>
