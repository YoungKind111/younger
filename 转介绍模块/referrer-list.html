        ]);

        // 当前推荐人的签约客户
        const currentReferralCustomers = computed(() => {
          if (!currentRow.value) return [];
          return referralCustomers.value.filter(item => item.referrerId === currentRow.value.id);
        });

        // 从签约客户数据同步推荐人统计（确保列表和详情数字一致）
        const syncReferrerStats = () => {
          tableData.value.forEach(r => {
            const customers = referralCustomers.value.filter(c => c.referrerId === r.id);
            r.totalReferrals = customers.length;
            r.successfulReferrals = customers.length;
            r.totalCommission = Number(customers.reduce((sum, c) => sum + c.commissionAmount, 0).toFixed(2));
            r.pendingCommission = Number(customers.filter(c => c.paymentStatus === '未打款').reduce((sum, c) => sum + c.commissionAmount, 0).toFixed(2));
          });
          // 同步顶部统计卡片
          stats.value.totalCommission = tableData.value.reduce((sum, r) => sum + r.totalCommission, 0);
          stats.value.pendingCommission = tableData.value.reduce((sum, r) => sum + r.pendingCommission, 0);
          stats.value.totalReferrals = tableData.value.reduce((sum, r) => sum + r.totalReferrals, 0);
        };
        syncReferrerStats();

        // 过滤后的数据（按ID从大到小排序）
        const filteredData = computed(() => {
          let result = [...tableData.value];
          if (searchForm.value.name) {
            result = result.filter(item => item.name.includes(searchForm.value.name));
          }
          if (searchForm.value.phone) {
            result = result.filter(item => item.phone.includes(searchForm.value.phone));
          }
          if (searchForm.value.type) {
            result = result.filter(item => item.type === searchForm.value.type);
          }
          return result.sort((a, b) => b.id - a.id);
        });

        // 标签类型映射
        const typeTagType = (type) => {
          const map = { '老客户': 'success', '月嫂': 'warning', '员工': 'primary' };
          return map[type] || 'info';
        };

        // 手机号脱敏
        const maskPhone = (phone) => {
          if (!phone) return '-';
          const str = String(phone);
          if (str.length === 11) {
            return str.slice(0, 3) + '****' + str.slice(7);
          }
          return str;
        };
        const approvalTagType = (status) => {
          const map = { '待审核': 'warning', '审批通过': 'success', '审批不通过': 'danger' };
          return map[status] || 'info';
        };
        const paymentTagType = (status) => {
          const map = { '未打款': 'info', '已打款': 'success' };
          return map[status] || 'info';
        };

        // 详情页动态计算的佣金统计
        const detailTotalCommission = computed(() => {
          return currentReferralCustomers.value.reduce((sum, item) => sum + item.commissionAmount, 0);
        });
        const detailPendingCommission = computed(() => {
          return currentReferralCustomers.value
            .filter(item => item.paymentStatus === '未打款')
            .reduce((sum, item) => sum + item.commissionAmount, 0);
        });

        // 搜索
        const handleSearch = () => {
          loading.value = true;
          setTimeout(() => { loading.value = false; }, 300);
        };

        // 重置
        const handleReset = () => {
          searchForm.value = { name: '', phone: '', type: '' };
        };

        // 新增
        const handleAdd = () => {
          isEdit.value = false;
          editingId.value = null;
          form.value = { name: '', phone: '', idCard: '', type: '老客户', bankName: '', branchName: '', accountNo: '', accountName: '' };
          dialogVisible.value = true;
        };

        // 编辑
        const handleEdit = (row) => {
          isEdit.value = true;
          editingId.value = row.id;
          form.value = { ...row };
          dialogVisible.value = true;
        };

        // 查看
        const handleView = (row) => {
          currentRow.value = row;
          detailVisible.value = true;
        };

        // 保存
        const saveData = () => {
          if (!form.value.name || !form.value.phone) {
            ElementPlus.ElMessage.warning('请填写姓名和手机号');
            return;
          }
          if (isEdit.value) {
            const index = tableData.value.findIndex(item => item.id === editingId.value);
            if (index > -1) {
              tableData.value[index] = { ...tableData.value[index], ...form.value };
            }
            ElementPlus.ElMessage.success('更新成功');
          } else {
            const newId = Math.max(...tableData.value.map(item => item.id), 0) + 1;
            tableData.value.push({ id: newId, totalReferrals: 0, successfulReferrals: 0, totalCommission: 0, pendingCommission: 0, ...form.value });
            pageInfo.value.total += 1;
            ElementPlus.ElMessage.success('添加成功');
          }
          dialogVisible.value = false;
        };

        // 删除
        const handleDelete = (row) => {
          ElementPlus.ElMessageBox.confirm(
            `确定删除推荐人 "${row.name}" 吗？删除后将无法恢复。`,
            '提示',
            { type: 'warning' }
          ).then(() => {
            const index = tableData.value.findIndex(item => item.id === row.id);
            if (index > -1) {
              tableData.value.splice(index, 1);
              pageInfo.value.total -= 1;
            }
            ElementPlus.ElMessage.success('删除成功');
          });
        };

        return {
          stats, searchForm, dialogVisible, detailVisible, isEdit, editingId,
          currentRow, loading, form, pageInfo, tableData, filteredData,
          currentReferralCustomers, detailTotalCommission, detailPendingCommission,
          typeTagType, approvalTagType, paymentTagType, maskPhone,
          handleSearch, handleReset, handleAdd, handleEdit, handleView, saveData, handleDelete
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
