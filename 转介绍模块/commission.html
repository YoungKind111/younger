<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佣金结算 - 氧阁ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .approval-table th { background: #fafafa; }
    .approval-table .el-table__cell { padding: 8px 0 !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
  <script src="shared-menu.js"></script>

  <script>
    const { createApp, ref, computed } = Vue;

    SharedMenu.initPageLayout('commission', {
      title: '佣金结算',
      breadcrumb: '佣金结算'
    });

    createApp({
      template: `
        <div>
          <!-- 列表卡片 -->
          <div class="content-card">
            <div class="card-header">
              <span class="card-title">佣金结算列表</span>
            </div>
            <div class="card-body">
              <el-alert type="info" :closable="false" style="margin-bottom: 12px;">
                本列表仅展示<strong>已签约</strong>的转介绍订单
              </el-alert>
              <!-- 搜索栏 -->
              <div class="search-bar">
                <el-input v-model="searchForm.referrerName" placeholder="推荐人姓名" clearable></el-input>
                <el-input v-model="searchForm.initiatorName" placeholder="申请人" clearable></el-input>
                <el-input v-model="searchForm.customerName" placeholder="客户姓名" clearable></el-input>
                <el-input v-model="searchForm.orderNo" placeholder="订单编号" clearable></el-input>
                <el-select v-model="searchForm.referrerType" placeholder="介绍类型" clearable>
                  <el-option label="月嫂介绍" value="月嫂介绍"></el-option>
                  <el-option label="客户介绍" value="客户介绍"></el-option>
                  <el-option label="员工介绍" value="员工介绍"></el-option>
                </el-select>
                <el-select v-model="searchForm.approvalStatus" placeholder="审批状态" clearable>
                  <el-option label="未申请" value="未申请"></el-option>
                  <el-option label="审批中" value="审批中"></el-option>
                  <el-option label="已通过" value="已通过"></el-option>
                  <el-option label="已驳回" value="已驳回"></el-option>
                </el-select>
                <el-select v-model="searchForm.paymentStatus" placeholder="打款状态" clearable>
                  <el-option label="未打款" value="未打款"></el-option>
                  <el-option label="待打款" value="待打款"></el-option>
                  <el-option label="已打款" value="已打款"></el-option>
                </el-select>
                <el-button type="primary" @click="handleSearch">搜索</el-button>
                <el-button @click="handleReset">重置</el-button>
                <el-button type="warning" plain @click="handleUpdateCollectionStatus">
                  更新收款状态
                </el-button>
                <el-checkbox v-model="onlyMyReview" style="margin-left: 8px;">
                  只看我待审
                </el-checkbox>
              </div>

              <!-- 数据表格 -->
              <el-table 
                :data="filteredData" 
                style="width: 100%" 
                height="100%"
                v-loading="loading"
              >
                <el-table-column prop="signDate" label="客户签约时间" width="100">
                  <template #default="{ row }">
                    <span v-if="row.signDate">{{ row.signDate }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="customerName" label="客户名称" width="90"></el-table-column>
                <el-table-column prop="contractAmount" label="签约套餐金额" width="100">
                  <template #default="{ row }">
                    <span v-if="row.contractAmount">¥{{ row.contractAmount.toLocaleString() }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="serviceDays" label="签约天数" width="70" align="center">
                  <template #default="{ row }">
                    <span>{{ row.serviceDays }}</span>
                  </template>
                </el-table-column>
                <el-table-column prop="signedPackage" label="签约套餐" width="130">
                  <template #default="{ row }">
                    <span v-if="row.signedPackage">{{ row.signedPackage }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="packageType" label="套餐类型" width="80">
                  <template #default="{ row }">
                    <el-tag v-if="row.packageType !== '-'" size="small" :type="row.packageType === '特价套餐' ? 'warning' : 'success'">{{ row.packageType }}</el-tag>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="ruleHit" label="命中规则" width="110">
                  <template #default="{ row }">
                    <el-tag size="small" :type="ruleTagType(row.ruleHit)">{{ row.ruleHit }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="commissionAmount" label="佣金金额" width="90">
                  <template #default="{ row }">
                    <span style="color: #f5222d; font-weight: 600;">¥{{ row.commissionAmount.toLocaleString() }}</span>
                  </template>
                </el-table-column>
                <el-table-column prop="orderNo" label="订单编号" width="120">
                  <template #default="{ row }">
                    <span v-if="row.orderNo" style="font-family: monospace; font-size: 13px;">{{ row.orderNo }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="orderSales" label="订单归属销售" width="100">
                  <template #default="{ row }">
                    <span v-if="row.orderSales">{{ row.orderSales }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="referrerName" label="推荐人" width="80"></el-table-column>
                <el-table-column prop="referrerType" label="介绍类型" width="80">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.referrerType === '月嫂介绍' ? 'warning' : (row.referrerType === '员工介绍' ? 'primary' : 'success')">{{ row.referrerType }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="collectionStatus" label="收款状态" width="90">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.collectionStatus === '收齐全款' ? 'success' : (row.collectionStatus === '收齐定金' ? 'warning' : 'info')">{{ row.collectionStatus }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="initiatorName" label="申请人" width="80">
                  <template #default="{ row }">
                    <span v-if="row.approvalStatus !== '未申请' && row.initiatorName">{{ row.initiatorName }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="initiatorDept" label="申请人部门" width="100">
                  <template #default="{ row }">
                    <span v-if="row.approvalStatus !== '未申请' && row.initiatorDept">{{ row.initiatorDept }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="applyTime" label="申请时间" width="150">
                  <template #default="{ row }">
                    <span v-if="row.applyTime">{{ row.applyTime }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="approvalStatus" label="审批状态" width="70">
                  <template #default="{ row }">
                    <el-tag size="small" :type="approvalTagType(row.approvalStatus)">{{ row.approvalStatus }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="paymentStatus" label="打款状态" width="70">
                  <template #default="{ row }">
                    <el-tag size="small" :type="paymentTagType(row.paymentStatus)">{{ row.paymentStatus }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column label="操作" width="220" fixed="right">
                  <template #default="{ row }">
                    <!-- 查看：所有记录都有 -->
                    <el-button type="primary" size="small" plain @click="handleView(row)">查看</el-button>
                    <!-- 未申请状态 -->
                    <template v-if="row.approvalStatus === '未申请'">
                      <el-tooltip :content="getApplyBlockReason(row)" placement="top" :disabled="canApply(row)">
                        <el-button :type="canApply(row) ? 'primary' : 'info'" :disabled="!canApply(row)" size="small" @click="handleRowAction(row)">{{ getActionLabel(row) }}</el-button>
                      </el-tooltip>
                    </template>
                    <!-- 审批中状态 -->
                    <template v-if="row.approvalStatus === '审批中'">
                      <el-button type="primary" size="small" @click="handleApprove(row)">审批</el-button>
                    </template>
                    <!-- 已通过且待打款 -->
                    <template v-if="row.approvalStatus === '已通过' && row.paymentStatus === '待打款'">
                      <el-button type="primary" size="small" @click="handlePay(row)">打款</el-button>
                    </template>
                    <!-- 已驳回状态 -->
                    <template v-if="row.approvalStatus === '已驳回'">
                      <el-button type="warning" size="small" @click="handleApply(row)">重新申请</el-button>
                    </template>
                  </template>
                </el-table-column>
              </el-table>
            </div>
          </div>

          <!-- 单条申请对话框 -->
          <el-dialog v-model="applyDialogVisible" title="佣金申请" width="600px">
            <el-form v-if="currentApplyRow" label-width="100px">
              <!-- 推荐人银行卡信息（只读） -->
              <el-divider content-position="left">推荐人银行信息</el-divider>
              <el-form-item label="推荐人">
                <span style="font-weight: 600;">{{ currentApplyRow.referrerName }}</span>
              </el-form-item>
              <el-form-item label="开户行">
                <span>{{ currentApplyRow.bankName || '-' }}</span>
              </el-form-item>
              <el-form-item label="支行">
                <span>{{ currentApplyRow.branchName || '-' }}</span>
              </el-form-item>
              <el-form-item label="账号">
                <span style="font-family: monospace;">{{ currentApplyRow.accountNo || '-' }}</span>
              </el-form-item>
              <el-form-item label="户名">
                <span>{{ currentApplyRow.accountName || '-' }}</span>
              </el-form-item>

              <!-- 佣金信息 -->
              <el-divider content-position="left">佣金信息</el-divider>
              <el-form-item label="税前佣金">
                <el-input-number v-model="applyForm.commissionAmount" :min="0" :precision="2" style="width: 180px;"></el-input-number>
                <span style="margin-left: 8px; color: #8c8c8c; font-size: 13px;">原计算金额 ¥{{ currentApplyRow.commissionAmount?.toLocaleString() }}</span>
              </el-form-item>

              <!-- 申请信息 -->
              <el-divider content-position="left">申请信息</el-divider>
              <el-form-item label="申请事由" prop="reason">
                <el-input v-model="applyForm.reason" type="textarea" :rows="3" placeholder="请输入申请事由"></el-input>
              </el-form-item>
              <el-form-item label="附件">
                <div tabindex="0" @paste="handlePasteUpload" style="outline: none;">
                  <el-upload
                    v-model:file-list="applyForm.attachments"
                    action="#"
                    :auto-upload="false"
                    :multiple="true"
                  >
                    <el-button type="primary">选择文件</el-button>
                    <template #tip>
                      <div class="el-upload__tip">支持 Ctrl+V 粘贴上传，或点击选择文件</div>
                    </template>
                  </el-upload>
                </div>
              </el-form-item>
            </el-form>
            <template #footer>
              <el-button @click="applyDialogVisible = false">取消</el-button>
              <el-button type="primary" @click="confirmApply">确认申请</el-button>
            </template>
          </el-dialog>



          <!-- 详情对话框 -->
          <el-dialog v-model="detailVisible" :title="detailTitle" width="750px">
            <div v-if="currentRow">
              <!-- 基本信息 -->
              <div class="detail-grid mb-2">
                <div class="detail-item">
                  <span class="detail-label">审批状态</span>
                  <el-tag size="small" :type="approvalTagType(currentRow.approvalStatus)">{{ currentRow.approvalStatus }}</el-tag>
                </div>
                <div class="detail-item">
                  <span class="detail-label">打款状态</span>
                  <el-tag size="small" :type="paymentTagType(currentRow.paymentStatus)">{{ currentRow.paymentStatus }}</el-tag>
                </div>
                <div class="detail-item" v-if="currentRow.applyTime">
                  <span class="detail-label">申请时间</span>
                  <span class="detail-value">{{ currentRow.applyTime }}</span>
                </div>
                <div class="detail-item" v-if="currentRow.applicant">
                  <span class="detail-label">申请人</span>
                  <span class="detail-value">{{ currentRow.applicant }}</span>
                </div>
                <div class="detail-item" v-if="currentRow.payTime">
                  <span class="detail-label">打款时间</span>
                  <span class="detail-value">{{ currentRow.payTime }}</span>
                </div>
                <div class="detail-item" v-if="currentRow.voucherNo">
                  <span class="detail-label">凭证号</span>
                  <span class="detail-value">{{ currentRow.voucherNo }}</span>
                </div>
              </div>

              <!-- 推荐人信息卡片 -->
              <el-card shadow="never" class="mb-2" style="background: #fafafa;">
                <div style="display: flex; justify-content: space-between;">
                  <div>
                    <div style="font-weight: 600; margin-bottom: 8px;">推荐人：{{ currentRow.referrerName }}</div>
                    <div style="font-size: 13px; color: #8c8c8c;">手机号：{{ currentRow.referrerPhone || '-' }}</div>
                    <div style="font-size: 13px; color: #8c8c8c;">身份证：{{ currentRow.referrerIdCard || '-' }}</div>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-size: 13px; color: #8c8c8c;">开户行：{{ currentRow.bankName || '-' }}</div>
                    <div style="font-size: 13px; color: #8c8c8c;">支行：{{ currentRow.branchName || '-' }}</div>
                    <div style="font-size: 13px; color: #8c8c8c;">账号：{{ currentRow.accountNo || '-' }}</div>
                    <div style="font-size: 13px; color: #8c8c8c;">户名：{{ currentRow.accountName || '-' }}</div>
                  </div>
                </div>
              </el-card>

              <!-- 佣金明细 -->
              <el-divider content-position="left">佣金明细</el-divider>
              <div class="detail-grid mb-2">
                <div class="detail-item">
                  <span class="detail-label">客户名称</span>
                  <span class="detail-value">{{ currentRow.customerName }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">合同金额</span>
                  <span class="detail-value">¥{{ currentRow.contractAmount?.toLocaleString() || '-' }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">套餐天数</span>
                  <span class="detail-value">{{ currentRow.serviceDays || '-' }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">命中规则</span>
                  <span class="detail-value">{{ currentRow.ruleHit }}</span>
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; margin-top: 12px; padding-right: 16px;">
                <span style="font-size: 14px; color: #8c8c8c;">合计税前佣金：</span>
                <span style="font-size: 20px; font-weight: 700; color: #f5222d; margin-left: 8px;">¥{{ currentRow.commissionAmount.toLocaleString() }}</span>
              </div>

              <!-- 打款信息（仅已打款） -->
              <template v-if="currentRow.paymentStatus === '已打款'">
                <el-divider content-position="left">打款信息</el-divider>
                <div class="detail-grid mb-2">
                  <div class="detail-item">
                    <span class="detail-label">税前金额</span>
                    <span class="detail-value">¥{{ currentRow.commissionAmount.toLocaleString() }}</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">代扣个税</span>
                    <span class="detail-value">¥{{ currentRow.taxAmount?.toLocaleString() || '0' }}</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">税后实发</span>
                    <span class="detail-value" style="color: #f5222d; font-weight: 600;">¥{{ currentRow.actualAmount?.toLocaleString() || currentRow.commissionAmount.toLocaleString() }}</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">凭证号</span>
                    <span class="detail-value">{{ currentRow.voucherNo || '-' }}</span>
                  </div>
                </div>
              </template>

              <!-- 审批记录表格 -->
              <el-divider content-position="left">审批记录</el-divider>
              <el-table 
                :data="currentRow.approvalRecords || []" 
                size="small" 
                border 
                class="approval-table"
                style="width: 100%"
              >
                <el-table-column prop="approver" label="审核人" min-width="90"></el-table-column>
                <el-table-column prop="time" label="审核日期" min-width="140"></el-table-column>
                <el-table-column prop="comment" label="审核意见" min-width="100">
                  <template #default="{ row }">
                    <span v-if="row.comment">{{ row.comment }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="status" label="审核状态" width="80">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.status === '通过' ? 'success' : (row.status === '不通过' ? 'danger' : 'info')">{{ row.status }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="nextNode" label="下一节点" min-width="110">
                  <template #default="{ row }">
                    <span v-if="row.nextNode">{{ row.nextNode }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
                <el-table-column prop="nextApprover" label="下一节点审批人" min-width="110">
                  <template #default="{ row }">
                    <span v-if="row.nextApprover">{{ row.nextApprover }}</span>
                    <span v-else style="color: #8c8c8c;">-</span>
                  </template>
                </el-table-column>
              </el-table>
            </div>

            <template #footer>
              <el-button @click="detailVisible = false">关闭</el-button>
            </template>
          </el-dialog>

          <!-- 节点审批操作对话框 -->
          <el-dialog v-model="approveDialogVisible" :title="' ' + (currentNode?.name || '')" width="500px">
            <div style="margin-bottom: 16px;">
              <span style="color: #8c8c8c; font-size: 13px;">当前审批人：{{ currentNodeApprovers[0] || '-' }}</span>
            </div>
            <!-- 申请信息展示 -->
            <el-card shadow="never" style="background: #f6ffed; border: 1px solid #b7eb8f; margin-bottom: 16px;" v-if="currentRow">
              <div style="margin-bottom: 12px;">
                <div style="font-size: 13px; color: #8c8c8c; margin-bottom: 4px;">申请事由</div>
                <div style="font-size: 14px; color: #262626;">{{ currentRow.applyReason || '-' }}</div>
              </div>
              <div v-if="currentRow.applyAttachments && currentRow.applyAttachments.length">
                <div style="font-size: 13px; color: #8c8c8c; margin-bottom: 4px;">附件</div>
                <div>
                  <el-tag v-for="(file, idx) in currentRow.applyAttachments" :key="idx" size="small" style="margin-right: 8px; margin-bottom: 4px;">{{ file }}</el-tag>
                </div>
              </div>
            </el-card>
            <el-form>
              <el-form-item label="备注">
                <el-input v-model="approveForm.comment" type="textarea" rows="4" placeholder="请输入审核备注"></el-input>
              </el-form-item>
            </el-form>
            <template #footer>
              <div style="display: flex; gap: 12px;">
                <el-button type="danger" style="flex: 1;" @click="doReject">拒绝</el-button>
                <el-button type="primary" style="flex: 1;" @click="doPass">通过</el-button>
              </div>
            </template>
          </el-dialog>

          <!-- 打款对话框 -->
          <el-dialog v-model="payDialogVisible" title="打款" width="500px">
            <div v-if="currentPayRow">
              <el-alert type="warning" :closable="false" class="mb-2">
                请确认已完成网银/柜台转账，再点击"确认已打款"。
              </el-alert>
              <div class="detail-grid mb-2">
                <div class="detail-item">
                  <span class="detail-label">推荐人</span>
                  <span class="detail-value">{{ currentPayRow.referrerName }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">收款银行</span>
                  <span class="detail-value">{{ currentPayRow.bankName || '-' }} {{ currentPayRow.branchName || '-' }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">收款账号</span>
                  <span class="detail-value">{{ currentPayRow.accountNo || '-' }}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">户名</span>
                  <span class="detail-value">{{ currentPayRow.accountName || '-' }}</span>
                </div>
              </div>
              <el-divider></el-divider>
              <el-form label-width="100px">
                <el-form-item label="税前金额">
                  <span style="font-weight: 600;">¥{{ currentPayRow.commissionAmount.toLocaleString() }}</span>
                </el-form-item>
                <el-form-item label="代扣个税">
                  <el-input-number v-model="payForm.taxAmount" :min="0" :precision="2" style="width: 150px;" @change="calcActual"></el-input-number>
                  <span style="margin-left: 8px; color: #8c8c8c; font-size: 13px;">单笔≤800元免个税</span>
                </el-form-item>
                <el-form-item label="税后实发">
                  <span style="font-size: 20px; font-weight: 700; color: #f5222d;">¥{{ payForm.actualAmount.toLocaleString() }}</span>
                </el-form-item>
                <el-form-item label="凭证号">
                  <el-input v-model="payForm.voucherNo" placeholder="网银流水号或柜台凭证号"></el-input>
                </el-form-item>
                <el-form-item label="打款备注">

            { nodeId: 'quality_officer', nodeName: '运营负责人', approver: '梁艳红', time: '2026/2/5 11:00:00', status: '通过', comment: '同意', nextNode: '会计审核', nextApprover: '何才连' },
            { nodeId: 'accountant', nodeName: '会计审核', approver: '何才连', time: '2026/2/5 14:00:00', status: '通过', comment: '核对无误', nextNode: '财务负责人审核', nextApprover: '尹俊' },
            { nodeId: 'finance_leader', nodeName: '财务负责人审核', approver: '尹俊', time: '2026/2/5 16:00:00', status: '通过', comment: '同意', nextNode: '总经理审核', nextApprover: '卓大龙' },
            { nodeId: 'general_manager', nodeName: '总经理审核', approver: '卓大龙', time: '2026/2/6 09:00:00', status: '通过', comment: '同意', nextNode: '-', nextApprover: '-' }
          ]}
        ]);

        const filteredData = computed(() => {
          let result = [...tableData.value];
          if (searchForm.value.referrerName) result = result.filter(item => item.referrerName.includes(searchForm.value.referrerName));
          if (searchForm.value.initiatorName) result = result.filter(item => item.initiatorName && item.initiatorName.includes(searchForm.value.initiatorName));
          if (searchForm.value.customerName) result = result.filter(item => item.customerName.includes(searchForm.value.customerName));
          if (searchForm.value.orderNo) result = result.filter(item => item.orderNo && item.orderNo.includes(searchForm.value.orderNo));
          if (searchForm.value.referrerType) result = result.filter(item => item.referrerType === searchForm.value.referrerType);
          if (searchForm.value.approvalStatus) result = result.filter(item => item.approvalStatus === searchForm.value.approvalStatus);
          if (searchForm.value.paymentStatus) result = result.filter(item => item.paymentStatus === searchForm.value.paymentStatus);
          if (onlyMyReview.value) {
            result = result.filter(item => {
              if (item.approvalStatus !== '审批中') return false;
              const node = getCurrentNode(item);
              return node && node.approvers.includes(currentUser.value.name);
            });
          }
          const order = { '未申请': 0, '审批中': 1, '已通过': 2, '已驳回': 3, '已打款': 4 };
          return result.sort((a, b) => {
            const diff = (order[a.approvalStatus] ?? 99) - (order[b.approvalStatus] ?? 99);
            if (diff !== 0) return diff;
            return (order[a.paymentStatus] ?? 99) - (order[b.paymentStatus] ?? 99);
          });
        });

        const ruleTagType = (rule) => {
          const map = { '第1单固定200元': 'success', '第2单 3%': 'primary', '第3单 3%': 'primary', '第4单 4%': 'primary', '第5单 4%': 'primary', '第6单 5%': 'primary', '特价套餐固定200元': 'warning', '短天数固定100元': 'info', '月嫂推荐 10%': 'warning', '员工介绍 固定200元': 'primary', '未签约': 'info', '11月渠道汇总': 'primary', '1月渠道结算': 'primary', '其他奖励': 'info' };
          return map[rule] || 'info';
        };

        const approvalTagType = (status) => {
          const map = { '未申请': 'info', '审批中': 'primary', '已通过': 'success', '已驳回': 'danger' };
          return map[status] || 'info';
        };

        const paymentTagType = (status) => {
          const map = { '未打款': 'info', '待打款': 'warning', '已打款': 'success' };
          return map[status] || 'info';
        };

        const handleSearch = () => {
          loading.value = true;
          setTimeout(() => { loading.value = false; }, 300);
        };

        const handleUpdateCollectionStatus = () => {
          let updatedCount = 0;
          tableData.value.forEach(row => {
            if (row.approvalStatus !== '未申请') return;
            if (canApply(row)) return;
            if (row.referrerType === '月嫂介绍') {
              if (row.collectionStatus !== '收齐全款') {
                row.collectionStatus = '收齐全款';
                updatedCount++;
              }
            } else {
              if (row.collectionStatus !== '收齐定金' && row.collectionStatus !== '收齐全款') {
                row.collectionStatus = '收齐定金';
                updatedCount++;
              }
            }
          });
          if (updatedCount > 0) {
            ElementPlus.ElMessage.success('已更新 ' + updatedCount + ' 条订单的收款状态，满足条件的订单已变为可申请');
          } else {
            ElementPlus.ElMessage.info('暂无可更新的订单');
          }
        };

        const handleReset = () => {
          searchForm.value = { referrerName: '', initiatorName: '', customerName: '', orderNo: '', referrerType: '', approvalStatus: '', paymentStatus: '' };
        };

        // 生成分组标识
        const genRequestNo = () => {
          const now = new Date();
          const y = now.getFullYear();
          const m = String(now.getMonth() + 1).padStart(2, '0');
          const d = String(now.getDate()).padStart(2, '0');
          const seq = String(requestIdCounter++).padStart(3, '0');
          return `FY${y}${m}${d}${seq}`;
        };

        // 从待结算记录创建申请单
        const createRequestFromRows = (rows) => {
          const now = new Date().toLocaleString();
          const group = {};
          rows.forEach(row => {
            if (!group[row.referrerName]) {
              group[row.referrerName] = {
                requestNo: genRequestNo(),
                applicant: '黄敏仪',
                applyTime: now,
                referrerPhone: row.referrerPhone,
                referrerIdCard: row.referrerIdCard,
                bankName: row.bankName,
                branchName: row.branchName,
                accountNo: row.accountNo,
                accountName: row.accountName,
                approvalRecords: [
                  { nodeId: 'submit', nodeName: '提交', approver: '黄敏仪（销售部北滘）', time: now, status: '提交', comment: '提交申请', nextNode: FLOW_NODES[1].name, nextApprover: FLOW_NODES[1].approvers[0] }
                ]
              };
            }
          });

          rows.forEach(row => {
            const g = group[row.referrerName];
            row.requestNo = g.requestNo;
            row.approvalStatus = '审批中';
            row.paymentStatus = '未打款';
            row.applicant = g.applicant;
            row.initiatorName = g.applicant;
            row.initiatorDept = '销售部北滘';
            row.applyTime = g.applyTime;
            row.approvalRecords = [...g.approvalRecords];
          });
        };

        // 判断是否满足申请条件
        const canApply = (row) => {
          if (row.approvalStatus !== '未申请') return false;
          if (row.signStatus !== '已签约') return false;
          if (row.referrerType === '月嫂介绍') {
            return row.collectionStatus === '收齐全款';
          }
          // 客户介绍、员工介绍：收齐定金或全款均可
          return row.collectionStatus === '收齐定金' || row.collectionStatus === '收齐全款';
        };

        const getApplyBlockReason = (row) => {
          if (row.approvalStatus !== '未申请') return '';
          if (row.signStatus !== '已签约') return '未签约，不可申请';
          if (row.referrerType === '月嫂介绍') {
            return '月嫂推荐需收齐全款后才可申请';
          }
          return '需收齐定金（全款的20%）后才可申请';
        };

        const getActionLabel = (row) => {
          if (row.approvalStatus === '未申请') return canApply(row) ? '申请' : '不可申请';
          if (row.approvalStatus === '审批中') return '审批';
          if (row.approvalStatus === '已通过' && row.paymentStatus === '待打款') return '打款';
          return '查看';
        };

        const handleRowAction = (row) => {
          if (row.approvalStatus === '未申请') {
            if (!canApply(row)) {
              ElementPlus.ElMessage.warning(getApplyBlockReason(row));
              return;
            }
            return handleApply(row);
          }
          if (row.approvalStatus === '审批中') return handleApprove(row);
          if (row.approvalStatus === '已通过' && row.paymentStatus === '待打款') return handlePay(row);
          return handleView(row);
        };

        const applyDialogVisible = ref(false);
        const currentApplyRow = ref(null);
        const applyForm = ref({
          reason: '',
          commissionAmount: 0,
          attachments: []
        });

        const handleApply = (row) => {
          currentApplyRow.value = row;
          applyForm.value = { reason: '', commissionAmount: row.commissionAmount, attachments: [] };
          applyDialogVisible.value = true;
        };

        const handlePasteUpload = (e) => {
          e.preventDefault();
          const files = e.clipboardData?.files;
          if (files && files.length) {
            for (const file of files) {
              applyForm.value.attachments.push({
                name: file.name,
                uid: Date.now() + Math.random(),
                size: file.size,
                raw: file,
                status: 'ready'
              });
            }
          }
        };

        const confirmApply = () => {
          if (!applyForm.value.reason.trim()) {
            ElementPlus.ElMessage.warning('请填写申请事由');
            return;
          }
          if (currentApplyRow.value) {
            currentApplyRow.value.commissionAmount = applyForm.value.commissionAmount;
            currentApplyRow.value.applyReason = applyForm.value.reason;
            currentApplyRow.value.applyAttachments = applyForm.value.attachments.map(f => f.name);
            createRequestFromRows([currentApplyRow.value]);
          }
          applyDialogVisible.value = false;
          ElementPlus.ElMessage.success('已生成佣金申请单，等待财务审批');
        };

        // ==================== 审批（多节点）====================
        const detailVisible = ref(false);
        const detailTitle = ref('申请单详情');
        const currentRow = ref(null);

        // 节点审批对话框
        const approveDialogVisible = ref(false);
        const currentNode = ref(null);
        const currentNodeApprovers = ref([]);
        const approveForm = ref({
          approver: '',
          result: '通过',
          comment: ''
        });

        const handleView = (row) => {
          currentRow.value = row;
          detailTitle.value = '申请单详情';
          detailVisible.value = true;
        };

        const handleApprove = (row) => {
          currentRow.value = row;
          const node = getCurrentNode(row);
          if (!node) {
            ElementPlus.ElMessage.warning('当前无待审批节点');
            return;
          }
          currentNode.value = node;
          currentNodeApprovers.value = node.approvers;
          approveForm.value = { comment: '' };
          approveDialogVisible.value = true;
        };

        const submitApproval = (isPass) => {
          if (!isPass && !approveForm.value.comment) {
            ElementPlus.ElMessage.warning('请填写驳回备注');
            return;
          }

          const node = currentNode.value;
          const requestNo = currentRow.value.requestNo;
          const approverName = currentNodeApprovers.value[0] || '审批人';
          const now = new Date().toLocaleString();

          const nodeIdx = FLOW_NODES.findIndex(n => n.id === node.id);
          const isLastNode = nodeIdx === FLOW_NODES.length - 1;

          let nextNodeName = '-';
          let nextApproverName = '-';
          if (isPass && !isLastNode) {
            const next = FLOW_NODES[nodeIdx + 1];
            nextNodeName = next.name;
            nextApproverName = next.approvers[0];
          }

          const statusText = isPass ? '通过' : '不通过';

          tableData.value.filter(r => r.requestNo === requestNo).forEach(r => {
            r.approvalRecords.push({
              nodeId: node.id,
              nodeName: node.name,
              approver: approverName,
              time: now,
              status: statusText,
              comment: approveForm.value.comment,
              nextNode: nextNodeName,
              nextApprover: nextApproverName
            });

            if (!isPass) {
              r.approvalStatus = '已驳回';
              r.paymentStatus = '未打款';
            } else if (isLastNode) {
              r.approvalStatus = '已通过';
              r.paymentStatus = '待打款';
            }
          });

          approveDialogVisible.value = false;

          if (isPass && isLastNode) {
            ElementPlus.ElMessage.success('审批完成，已流转至出纳打款');
          } else if (isPass) {
            ElementPlus.ElMessage.success(`已通过，流转至下一节点：${nextNodeName}`);
          } else {
            ElementPlus.ElMessage.success('已驳回');
          }
        };

        const doPass = () => submitApproval(true);
        const doReject = () => submitApproval(false);

        // ==================== 打款 ====================
        const payDialogVisible = ref(false);
        const currentPayRow = ref(null);
        const payForm = ref({
          taxAmount: 0,
          actualAmount: 0,
          voucherNo: '',
          remark: ''
        });

        const handlePay = (row) => {
          currentPayRow.value = row;
          const defaultTax = row.commissionAmount <= 800 ? 0 : Number((row.commissionAmount * 0.2).toFixed(2));
          payForm.value = {
            taxAmount: row.taxAmount ?? defaultTax,
            actualAmount: row.actualAmount ?? (row.commissionAmount - defaultTax),
            voucherNo: row.voucherNo || '',
            remark: ''
          };
          payDialogVisible.value = true;
        };

        const calcActual = () => {
          if (currentPayRow.value) {
            payForm.value.actualAmount = Number((currentPayRow.value.commissionAmount - payForm.value.taxAmount).toFixed(2));
          }
        };

        const confirmPay = () => {
          if (!payForm.value.voucherNo) {
            ElementPlus.ElMessage.warning('请输入凭证号');
            return;
          }
          if (currentPayRow.value) {
            const requestNo = currentPayRow.value.requestNo;
            tableData.value.filter(r => r.requestNo === requestNo && r.approvalStatus === '已通过' && r.paymentStatus === '待打款').forEach(r => {
              r.paymentStatus = '已打款';
              r.taxAmount = payForm.value.taxAmount;
              r.actualAmount = payForm.value.actualAmount;
              r.voucherNo = payForm.value.voucherNo;
              r.payTime = new Date().toLocaleString();
              r.payer = '出纳小李';
              r.approvalRecords.push({
                nodeId: 'cashier', nodeName: '出纳打款', approver: '出纳小李', time: r.payTime, status: '通过', comment: '已打款', nextNode: '-', nextApprover: '-'
              });
            });
          }
          payDialogVisible.value = false;
          ElementPlus.ElMessage.success('打款确认成功，已通知推荐人');
        };

        return {
          searchForm, loading, onlyMyReview, currentUser,
          filteredData, ruleTagType, approvalTagType, paymentTagType,
          handleSearch, handleReset, handleUpdateCollectionStatus,
          canApply, getApplyBlockReason,
          applyDialogVisible, currentApplyRow, applyForm,
          handleApply, handlePasteUpload, confirmApply,
          detailVisible, detailTitle, currentRow,
          handleView, handleApprove, handleRowAction, getActionLabel,
          approveDialogVisible, currentNode, currentNodeApprovers, approveForm,
          doPass, doReject,
          payDialogVisible, currentPayRow, payForm,
          handlePay, calcActual, confirmPay
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
