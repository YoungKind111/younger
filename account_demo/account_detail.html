<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>收款账户</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F080A0',
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .page-container {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f5f5f5;
      position: relative;
      padding-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .capsule-btn {
      background: rgba(0,0,0,0.05);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 4px 12px;
      gap: 8px;
    }
    .capsule-btn .divider {
      width: 1px;
      height: 16px;
      background: rgba(0,0,0,0.15);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #666;
      font-size: 14px;
    }
    .info-value {
      color: #333;
      font-size: 14px;
      font-weight: 500;
    }
    .idcard-img {
      width: 100%;
      aspect-ratio: 1.58;
      border-radius: 8px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .idcard-img.back {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .section-title {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #f6ffed;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #52c41a;
      border-radius: 50%;
    }
    .status-text {
      color: #52c41a;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- 顶部导航栏 -->
    <div class="bg-white pt-12 pb-3 px-4 flex items-center justify-between sticky top-0 z-10">
      <a href="salary.html" class="text-gray-800">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="text-lg font-medium text-gray-900">收款账户</h1>
      <div class="capsule-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="text-gray-600">
          <circle cx="6" cy="12" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="18" cy="12" r="2"/>
        </svg>
        <div class="divider"></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-600">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <div class="px-4 mt-3">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="status-dot"></span>
        <span class="status-text">账户已开通，收款功能正常</span>
      </div>

      <!-- 账户信息卡片 -->
      <div class="bg-white rounded-xl p-4 shadow-sm">
        <div class="text-gray-900 font-medium mb-2">收款账户信息</div>

        <div class="section-title">身份信息</div>
        <div class="info-row">
          <span class="info-label">开户人姓名</span>
          <span class="info-value">林福熙</span>
        </div>
        <div class="info-row">
          <span class="info-label">开户人身份证</span>
          <span class="info-value">440106********5171</span>
        </div>

        <div class="flex gap-3 mt-3">
          <div class="flex-1">
            <div class="section-title" style="margin-top:0;">身份证人像面</div>
            <div class="idcard-img"></div>
          </div>
          <div class="flex-1">
            <div class="section-title" style="margin-top:0;">身份证国徽面</div>
            <div class="idcard-img back"></div>
          </div>
        </div>

        <div class="section-title">银行卡信息</div>
        <div class="info-row">
          <span class="info-label">银行预留手机号</span>
          <span class="info-value">187****5371</span>
        </div>
        <div class="info-row">
          <span class="info-label">银行卡号</span>
          <span class="info-value">6222 **** **** 5171</span>
        </div>
        <div class="info-row">
          <span class="info-label">银行</span>
          <span class="info-value">中国工商银行</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
