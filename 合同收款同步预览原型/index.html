        .stat-value.warning { color: #ff4d4f; }

        .header-amounts {

        .ha-item .ha-old { color: #666; }
        .ha-item .ha-newc { color: #1890ff; }
        .ha-item .ha-newo { color: #e91e8c; }
        .ha-item .ha-none { color: #999; font-weight: normal; }

            border: 1px solid #d9d9d9;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .toggle-btn:hover { border-color: #e91e8c; color: #e91e8c; }

                    packageName: 'Y4 月子好帮手',
                    serviceDays: 42,
                    serviceAddress: '广州市番禺区南村镇',
                    packageAmount: 30000,
                    holidayCharge: 0,
                    totalAmount: 30000,
                    receivedAmount: 10000,
                    refundedAmount: 0,
                    actualReceived: 10000,
                    arrears: 20000,
                    status: 'signed',
                    signDate: '2026-04-18'
                },
                newOrder: {
                    packageLevelName: 'Y4 月子好帮手',
                    serviceDays: 42,
                    serviceAddress: '广州市番禺区南村镇',
                    packageAmount: 30000,
                    holidayCharge: 0,
                    totalReceivable: 30000,
                    receivedAmount: 10000,
                    refundedAmount: 0,
                    actualReceived: 10000,
                    arrears: 20000,
                    payments: [
                        {docNo: 'PAY20260420001', dept: '销售一部', receiver: '许晓璇', time: '2026-04-20 15:30', category: '合同收款', channel: '银行转账', amount: 10000, audit: '审核通过'}
                    ],
                    refunds: []
                },
                _duplicate: {
                    detected: true,
                    confidence: 85,
                    oldPayment: {docNo: 'BL20260418001', channel: '盛付通', amount: 10000, time: '2026-04-18 11:00'},
                    newPayment: {docNo: 'PAY20260420001', channel: '银行转账', amount: 10000, time: '2026-04-20 15:30'},
                    reason: '金额相同 + 时间差2天 + 新系统为手动补录渠道',
                    status: 'pending'  // pending / confirmed / rejected
                }
            }
        ];

        mockContracts.forEach((c, i) => {
            c._id = i;
            c._tab = 'all';
            c._expanded = true;
            c._diff = computeDiff(c);
        });

        let currentData = [...mockContracts];

        function fmtMoney(v) {
            if (v === null || v === undefined) return '—';
            return '¥' + v.toLocaleString('zh-CN');
        }
        function fmtStatus(s) {
            const map = { signed: '已签署', pending: '待处理', completed: '已完成', canceled: '已取消', drafting: '草稿' };
            return map[s] || s;
        }
        function statusClass(s) {
            const map = { signed: 'status-signed', pending: 'status-pending', completed: 'status-completed', canceled: 'status-canceled' };
            return map[s] || '';
        }
        function sum(arr, key) {
            return (arr || []).reduce((a, b) => a + (b[key] || 0), 0);
        }

        function computeDiff(c) {
            const d = { hasDiff: false, fields: [], diffAmount: 0, noNewContract: !c.newContract };
            const oldC = c.oldContract;
            const newC = c.newContract;
            const newO = c.newOrder;
            const hasNewOrder = newO !== null && newO !== undefined;
            const hasNewContract = newC !== null && newC !== undefined;

            // 新系统完全无数据（无合同也无订单）
            if (!hasNewOrder) {
                d.hasDiff = true;
                d.fields.push('新系统无数据');
                d.diffAmount = oldC.receivedAmount;
                return d;
            }

            function cmp3(oldVal, newCVal, newOVal) {
                if (hasNewContract) {
                    return oldVal === newCVal && oldVal === newOVal && newCVal === newOVal;
                }
                return oldVal === newOVal;
            }

            if (!cmp3(oldC.packageName, hasNewContract ? newC.packageName : null, newO.packageLevelName || newO.packageName)) {
                d.hasDiff = true; d.fields.push('套餐名称');
            }
            if (!cmp3(oldC.serviceDays, hasNewContract ? newC.serviceDays : null, newO.serviceDays)) {
                d.hasDiff = true; d.fields.push('服务天数');
            }
            if (!cmp3(oldC.serviceAddress, hasNewContract ? newC.serviceAddress : null, newO.serviceAddress)) {
                d.hasDiff = true; d.fields.push('服务地址');
            }
            if (!cmp3(oldC.packageAmount, hasNewContract ? newC.packageAmount : null, newO.packageAmount)) {
                d.hasDiff = true; d.fields.push('套餐金额');
            }
            if (!cmp3(oldC.holidayCharge, hasNewContract ? newC.holidayCharge : null, newO.holidayCharge)) {
                d.hasDiff = true; d.fields.push('节假日费用');
            }
            if (!cmp3(oldC.totalAmount, hasNewContract ? newC.totalAmount : null, newO.totalReceivable)) {
                d.hasDiff = true; d.fields.push('应收总金额');
            }
            if (!cmp3(oldC.receivedAmount, hasNewContract ? newC.receivedAmount : null, newO.receivedAmount)) {
                d.hasDiff = true; d.fields.push('已收金额');
                d.diffAmount = Math.abs(oldC.receivedAmount - newO.receivedAmount);
            }
            if (!cmp3(oldC.refundedAmount, hasNewContract ? newC.refundedAmount : null, newO.refundedAmount)) {
                d.hasDiff = true; d.fields.push('已退金额');
            }
            if (!cmp3(oldC.actualReceived, hasNewContract ? newC.actualReceived : null, newO.actualReceived)) {
                d.hasDiff = true; d.fields.push('实收金额');
            }
            if (!cmp3(oldC.arrears, hasNewContract ? newC.arrears : null, newO.arrears)) {
                d.hasDiff = true; d.fields.push('欠款');
            }
            if (hasNewContract && oldC.status !== newC.status) {
                d.hasDiff = true; d.fields.push('合同状态');
            }
            return d;
        }

        function renderStats() {
            const total = currentData.length;
            const ok = currentData.filter(c => !c._diff.hasDiff).length;
            const diff = total - ok;
            const diffAmount = currentData.reduce((s, c) => s + c._diff.diffAmount, 0);
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOk').textContent = ok;
            document.getElementById('statDiff').textContent = diff;
            document.getElementById('statDiffAmount').textContent = fmtMoney(diffAmount);
        }

        function renderList() {
            const container = document.getElementById('contractList');
            if (!currentData.length) {
                container.innerHTML = '<div class="empty-state">暂无数据</div>';
                return;
            }
            container.innerHTML = currentData.map(c => renderCard(c)).join('');
        }

        function renderCard(c) {
            const diff = c._diff;
            const oldR = c.oldContract.receivedAmount;
            const newCR = c.newContract ? c.newContract.receivedAmount : null;
            const newOR = c.newOrder ? c.newOrder.receivedAmount : null;
            const hasNewOrder = c.newOrder !== null && c.newOrder !== undefined;
            const hasNewContract = c.newContract !== null && c.newContract !== undefined;

            let diffTag;
            if (!hasNewOrder) {
                diffTag = `<span class="tag tag-diff">⚠ 新系统无数据</span>`;
            } else if (!hasNewContract) {
                diffTag = `<span class="tag tag-diff">⚠ 新系统无合同</span>`;
            } else if (diff.hasDiff) {
                diffTag = `<span class="tag tag-diff">⚠ 差异: ${diff.fields.join('、')}</span>`;
            } else {
                diffTag = `<span class="tag tag-ok">✅ 完全一致</span>`;
            }

            return `
            <div class="contract-card ${(!hasNewOrder || diff.hasDiff) ? 'has-diff' : 'no-diff'}" data-id="${c._id}">
                <div class="card-header" onclick="toggleCard(${c._id})">
                    <div class="header-left">
                        <div class="header-item">
                            <span class="label">合同编号</span>
                            <span class="value">${c.ticket}</span>
                        </div>
                        <div class="header-item">
                            <span class="label">客户</span>
                            <span class="value">${c.customerName}</span>
                        </div>
                        <div class="header-item">
                            <span class="label">月嫂</span>
                            <span class="value">${c.nannyName}</span>
                        </div>
                        <div class="header-item">
                            <span class="label">套餐</span>
                            <span class="value" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${hasNewOrder ? (c.newOrder.packageLevelName || c.newOrder.packageName) : c.oldContract.packageName}</span>
                        </div>
                        ${diffTag}
                    </div>
                    <div class="header-right">
                        <div class="header-amounts">
                            <div class="ha-item">老合同: <b class="ha-old">${fmtMoney(oldR)}</b></div>
                            <div class="ha-item">新合同: <b class="${hasNewContract ? 'ha-newc' : 'ha-none'}">${hasNewContract ? fmtMoney(newCR) : '无'}</b></div>
                            <div class="ha-item">新订单: <b class="${hasNewOrder ? 'ha-newo' : 'ha-none'}">${hasNewOrder ? fmtMoney(newOR) : '无'}</b></div>
                        </div>
                        <div class="toggle-btn ${c._expanded ? 'expanded' : ''}" id="toggle-${c._id}">▼</div>
                    </div>
                </div>
                <div class="card-body ${c._expanded ? 'expanded' : ''}" id="body-${c._id}">
                    ${renderTabs(c)}
                    ${renderSections(c)}
                </div>
            </div>`;
        }

        function renderTabs(c) {
            const hasNewOrder = c.newOrder !== null && c.newOrder !== undefined;
            const oldPay = c.oldContract.payments.length;
            const newOPay = hasNewOrder ? c.newOrder.payments.length : 0;
            const payCount = oldPay + newOPay;

            const oldRef = c.oldContract.refunds.length;
            const newORef = hasNewOrder ? c.newOrder.refunds.length : 0;
            const refCount = oldRef + newORef;

            const tabs = [
                { key: 'all', label: '全部' },
                { key: 'base', label: '基本信息' },
                { key: 'pay', label: '收款记录', badge: payCount || null },
                { key: 'refund', label: '退款记录', badge: refCount || null }
            ];
            return `
            <div class="section-tabs">
                ${tabs.map(t => `
                    <div class="tab ${c._tab === t.key ? 'active' : ''}" onclick="switchTab(${c._id}, '${t.key}')">
                        ${t.label}${t.badge ? `<span class="badge">${t.badge}</span>` : ''}
                    </div>
                `).join('')}
            </div>`;
        }

        function renderSections(c) {
            const showBase = c._tab === 'all' || c._tab === 'base';
            const showPay = c._tab === 'all' || c._tab === 'pay';
            const showRefund = c._tab === 'all' || c._tab === 'refund';
            const hasNewOrder = c.newOrder !== null && c.newOrder !== undefined;
            return `
                ${showBase ? renderBaseCompare(c) : ''}
                ${showPay ? renderPaymentTable(c) : ''}
                ${showRefund ? renderRefundTable(c) : ''}
                ${!hasNewOrder ? '<div class="empty-state" style="padding: 20px; color: #999;">新系统无订单数据，无法展示收款/退款记录</div>' : ''}
            `;
        }

        function renderBaseCompare(c) {
            const oldC = c.oldContract;
            const newC = c.newContract;
            const newO = c.newOrder;
            const hasNewOrder = newO !== null && newO !== undefined;
            const hasNewContract = newC !== null && newC !== undefined;

            function cmp3(oldVal, newCVal, newOVal) {
                if (hasNewContract) {
                    return oldVal === newCVal && oldVal === newOVal && newCVal === newOVal;
                }
                return oldVal === newOVal;
            }

            const rows = [
                { label: '套餐等级/套餐名', oldV: oldC.packageName, newCV: hasNewContract ? newC.packageName : null, newOV: hasNewOrder ? (newO.packageLevelName || newO.packageName) : null },
                { label: '服务天数', oldV: oldC.serviceDays + '天', newCV: hasNewContract ? newC.serviceDays + '天' : null, newOV: hasNewOrder ? newO.serviceDays + '天' : null },
                { label: '服务地址', oldV: oldC.serviceAddress, newCV: hasNewContract ? newC.serviceAddress : null, newOV: hasNewOrder ? newO.serviceAddress : null },
                { label: '套餐金额', oldV: oldC.packageAmount, newCV: hasNewContract ? newC.packageAmount : null, newOV: hasNewOrder ? newO.packageAmount : null },
                { label: '节假日费用', oldV: oldC.holidayCharge, newCV: hasNewContract ? newC.holidayCharge : null, newOV: hasNewOrder ? newO.holidayCharge : null },
                { label: '应收总金额', oldV: oldC.totalAmount, newCV: hasNewContract ? newC.totalAmount : null, newOV: hasNewOrder ? newO.totalReceivable : null },
                { label: '已收金额', oldV: oldC.receivedAmount, newCV: hasNewContract ? newC.receivedAmount : null, newOV: hasNewOrder ? newO.receivedAmount : null },
                { label: '已退金额', oldV: oldC.refundedAmount, newCV: hasNewContract ? newC.refundedAmount : null, newOV: hasNewOrder ? newO.refundedAmount : null },
                { label: '实收金额', oldV: oldC.actualReceived, newCV: hasNewContract ? newC.actualReceived : null, newOV: hasNewOrder ? newO.actualReceived : null },
                { label: '欠款', oldV: oldC.arrears, newCV: hasNewContract ? newC.arrears : null, newOV: hasNewOrder ? newO.arrears : null },
            ];

            let statusRow = '';
            if (hasNewContract) {
                const statusEq = oldC.status === newC.status;
                statusRow = `
                    <tr>
                        <td>合同状态</td>
                        <td class="${statusEq ? '' : 'diff-cell'}"><span class="${statusClass(oldC.status)}">${fmtStatus(oldC.status)}</span></td>
                        <td class="${statusEq ? '' : 'diff-cell'}"><span class="${statusClass(newC.status)}">${fmtStatus(newC.status)}</span></td>
                        <td class="no-contract">—</td>
                    </tr>
                `;
            }

            return `
            <table class="data-table compare-table" style="margin-bottom: 16px;">
                <thead>
                    <tr>
                        <th>字段</th>
                        <th><span class="src-tag src-old">老系统合同</span></th>
                        <th><span class="src-tag src-new-contract">新系统合同</span></th>
                        <th><span class="src-tag src-new-order">新系统订单</span></th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(r => {
                        const eq = cmp3(r.oldV, r.newCV, r.newOV);
                        const displayOld = typeof r.oldV === 'number' ? fmtMoney(r.oldV) : r.oldV;
                        const displayNewC = r.newCV === null ? '<span class="no-contract">无合同</span>' : (typeof r.newCV === 'number' ? fmtMoney(r.newCV) : r.newCV);
                        const displayNewO = r.newOV === null ? '<span class="no-contract">—</span>' : (typeof r.newOV === 'number' ? fmtMoney(r.newOV) : r.newOV);
                        return `
                            <tr>
                                <td>${r.label}</td>
                                <td class="${eq ? '' : 'diff-cell'}">${displayOld}</td>
                                <td class="${eq ? '' : 'diff-cell'}">${displayNewC}</td>
                                <td class="${eq ? '' : 'diff-cell'}">${displayNewO}</td>
                            </tr>
                        `;
                    }).join('')}
                    ${statusRow}
                </tbody>
            </table>`;
        }

        function renderPaymentTable(c) {
            const hasNewOrder = c.newOrder !== null && c.newOrder !== undefined;
            const oldPayments = c.oldContract.payments;
            const newPayments = hasNewOrder ? c.newOrder.payments : [];
            const oldSum = sum(oldPayments, 'amount');
            const newOSum = sum(newPayments, 'amount');
            const diffPay = Math.abs(oldSum - newOSum);

            let html = '';

            // 老系统收款
            const selectedPayKey = `pay_${c._id}`;
            if (!c._selectedPayments) c._selectedPayments = {};
            html += `
            <div style="margin-bottom: 16px;">
                <div style="font-weight: 600; margin-bottom: 8px; color: #333; display: flex; align-items: center; justify-content: space-between;">
                    <span class="src-tag src-old">老系统合同收款</span>
                    ${oldPayments.length ? `<label style="font-size: 12px; color: #666; cursor: pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" onchange="toggleSelectAll(${c._id}, 'payments', this.checked)"> 全选</label>` : ''}
                </div>
                ${oldPayments.length ? `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 36px;"><input type="checkbox" ${oldPayments.every((_, i) => c._selectedPayments[i]) ? 'checked' : ''} onchange="toggleSelectAll(${c._id}, 'payments', this.checked)"></th>
                            <th>单据编号</th>
                            <th>收款部门</th>
                            <th>收款人</th>
                            <th>单据日期</th>
                            <th>款项类别</th>
                            <th>支付方式</th>
                            <th class="col-right">单据金额</th>
                            <th>财务审核</th>

                    </thead>
                    <tbody>
                        ${oldPayments.map((p, i) => `

                                <td>${p.dept || '—'}</td>

                                <td>${p.time}</td>
                                <td>${p.category || '—'}</td>
                                <td>${p.channel}</td>
                                <td class="col-right" style="font-weight: 500;">${fmtMoney(p.amount)}</td>
                                <td><span class="${p.audit === '审核通过' ? 'status-signed' : 'status-pending'}">${p.audit || '—'}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; color: #666; font-size: 13px;">
                    <div>
                        已选 <b style="color: #e91e8c;">${Object.values(c._selectedPayments).filter(Boolean).length}</b> 笔 / 共 ${oldPayments.length} 笔
                        ${Object.values(c._selectedPayments).filter(Boolean).length > 0 ? `，合计 <b style="color: #e91e8c;">${fmtMoney(oldPayments.reduce((s, p, i) => s + (c._selectedPayments[i] ? p.amount : 0), 0))}</b>` : ''}
                    </div>
                    <div>老系统合同合计: <b style="color: #333;">${fmtMoney(oldSum)}</b></div>
                </div>
                ${Object.values(c._selectedPayments).filter(Boolean).length > 0 ? `
                <div style="padding: 8px 12px;">
                    <button class="btn" style="font-size: 12px; padding: 4px 12px;" onclick="syncSelected(${c._id}, 'payments')">同步已选记录到新系统</button>
                </div>
                ` : ''}
                ` : '<div class="empty-state" style="padding: 20px;">暂无收款记录</div>'}
            </div>`;

            // 新系统收款
            if (hasNewOrder) {
                html += `
                <div style="margin-bottom: 16px;">
                    <div style="font-weight: 600; margin-bottom: 8px; color: #333;">
                        <span class="src-tag src-new-order">新系统订单收款</span>
                    </div>
                    ${newPayments.length ? `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>支付单号</th>
                                <th>收款人部门</th>
                                <th>收款人</th>
                                <th>收款时间</th>
                                <th>款项类别</th>
                                <th>支付方式</th>
                                <th class="col-right">金额</th>
                                <th>审核状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${newPayments.map(p => `
                                <tr>
                                    <td>${p.docNo || '—'}</td>
                                    <td>${p.dept || '—'}</td>
                                    <td>${p.receiver || '—'}</td>
                                    <td>${p.time}</td>
                                    <td>${p.category || '—'}</td>
                                    <td>${p.channel}</td>
                                    <td class="col-right" style="font-weight: 500;">${fmtMoney(p.amount)}</td>
                                    <td><span class="${p.audit === '审核通过' ? 'status-signed' : 'status-pending'}">${p.audit || '—'}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div style="text-align: right; padding: 8px 12px; color: #666; font-size: 13px;">
                        新系统订单合计: <b style="color: #e91e8c;">${fmtMoney(newOSum)}</b>
                    </div>
                    ` : '<div class="empty-state" style="padding: 20px;">暂无收款记录</div>'}

            // 差异汇总
            html += `
            <div class="summary-bar" style="margin-bottom: 16px;">
                <div class="summary-left">
                    <div class="summary-item"><span class="s-label">老系统合同</span><span class="s-value old">${fmtMoney(oldSum)}</span></div>
                    <div class="summary-item"><span class="s-label">新系统订单</span><span class="s-value newo">${fmtMoney(newOSum)}</span></div>
                    <div class="summary-item"><span class="s-label">差异</span><span class="s-value diff">${diffPay === 0 ? '无' : fmtMoney(diffPay)}</span></div>
                </div>
            </div>`;

            return html;
        }

        function renderRefundTable(c) {
            const hasNewOrder = c.newOrder !== null && c.newOrder !== undefined;
            const oldRefunds = c.oldContract.refunds;
            const newRefunds = hasNewOrder ? c.newOrder.refunds : [];
            const oldSum = sum(oldRefunds, 'amount');
            const newOSum = sum(newRefunds, 'amount');
            const diffRef = Math.abs(oldSum - newOSum);

            if (!oldRefunds.length && !newRefunds.length) {
                return `<div class="empty-state" style="padding: 20px;">暂无退款记录</div>`;
            }

            let html = '';

            // 老系统退款
            if (!c._selectedRefunds) c._selectedRefunds = {};
            html += `
            <div style="margin-bottom: 16px;">
                <div style="font-weight: 600; margin-bottom: 8px; color: #333; display: flex; align-items: center; justify-content: space-between;">
                    <span class="src-tag src-old">老系统合同退款</span>
                    ${oldRefunds.length ? `<label style="font-size: 12px; color: #666; cursor: pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" onchange="toggleSelectAll(${c._id}, 'refunds', this.checked)"> 全选</label>` : ''}
                </div>
                ${oldRefunds.length ? `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 36px;"><input type="checkbox" ${oldRefunds.every((_, i) => c._selectedRefunds[i]) ? 'checked' : ''} onchange="toggleSelectAll(${c._id}, 'refunds', this.checked)"></th>

                    </thead>
                    <tbody>

                                <td>${r.dept || '—'}</td>
                                <td>${r.receiver || '—'}</td>
                                <td>${r.time}</td>

                                <td class="col-right" style="font-weight: 500; color: #ff4d4f;">${fmtMoney(r.amount)}</td>
                                <td><span class="${r.audit === '审核通过' ? 'status-signed' : 'status-pending'}">${r.audit || '—'}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; color: #666; font-size: 13px;">
                    <div>
                        已选 <b style="color: #e91e8c;">${Object.values(c._selectedRefunds).filter(Boolean).length}</b> 笔 / 共 ${oldRefunds.length} 笔
                        ${Object.values(c._selectedRefunds).filter(Boolean).length > 0 ? `，合计 <b style="color: #e91e8c;">${fmtMoney(oldRefunds.reduce((s, r, i) => s + (c._selectedRefunds[i] ? r.amount : 0), 0))}</b>` : ''}
                    </div>
                    <div>老系统合同合计: <b style="color: #ff4d4f;">${fmtMoney(oldSum)}</b></div>
                </div>
                ${Object.values(c._selectedRefunds).filter(Boolean).length > 0 ? `
                <div style="padding: 8px 12px;">
                    <button class="btn" style="font-size: 12px; padding: 4px 12px;" onclick="syncSelected(${c._id}, 'refunds')">同步已选记录到新系统</button>
                </div>
                ` : ''}
                ` : '<div class="empty-state" style="padding: 20px;">暂无退款记录</div>'}
            </div>`;

            // 新系统退款
            if (hasNewOrder) {
                html += `
                <div style="margin-bottom: 16px;">
                    <div style="font-weight: 600; margin-bottom: 8px; color: #333;">
                        <span class="src-tag src-new-order">新系统订单退款</span>
                    </div>
                    ${newRefunds.length ? `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>退款单号</th>
                                <th>退款人部门</th>
                                <th>退款人</th>
                                <th>退款时间</th>
                                <th>原因</th>
                                <th>支付方式</th>
                                <th class="col-right">金额</th>
                                <th>审核状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${newRefunds.map(r => `
                                <tr>
                                    <td>${r.docNo || '—'}</td>
                                    <td>${r.dept || '—'}</td>
                                    <td>${r.receiver || '—'}</td>
                                    <td>${r.time}</td>
                                    <td>${r.reason || '—'}</td>
                                    <td>${r.channel}</td>
                                    <td class="col-right" style="font-weight: 500; color: #ff4d4f;">${fmtMoney(r.amount)}</td>
                                    <td><span class="${r.audit === '审核通过' ? 'status-signed' : 'status-pending'}">${r.audit || '—'}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div style="text-align: right; padding: 8px 12px; color: #666; font-size: 13px;">
                        新系统订单合计: <b style="color: #ff4d4f;">${fmtMoney(newOSum)}</b>
                    </div>
                    ` : '<div class="empty-state" style="padding: 20px;">暂无退款记录</div>'}
                </div>`;
            }

            // 差异汇总
            html += `
            <div class="summary-bar" style="margin-bottom: 16px;">
                <div class="summary-left">
                    <div class="summary-item"><span class="s-label">老系统合同</span><span class="s-value old">${fmtMoney(oldSum)}</span></div>
                    <div class="summary-item"><span class="s-label">新系统订单</span><span class="s-value newo">${fmtMoney(newOSum)}</span></div>
                    <div class="summary-item"><span class="s-label">差异</span><span class="s-value diff">${diffRef === 0 ? '无' : fmtMoney(diffRef)}</span></div>
                </div>
            </div>`;

            return html;
        }

        function updateSyncBar() {
            let totalSelected = 0;
            let totalAmount = 0;
            let hasSelection = false;
            
            currentData.forEach(c => {
                const oldPayments = c.oldContract.payments || [];
                const oldRefunds = c.oldContract.refunds || [];
                const selPay = c._selectedPayments || {};
                const selRef = c._selectedRefunds || {};
                
                oldPayments.forEach((p, i) => {
                    if (selPay[i]) {
                        hasSelection = true;
                        totalSelected++;
                        totalAmount += p.amount;
                    }
                });
                oldRefunds.forEach((r, i) => {
                    if (selRef[i]) {
                        hasSelection = true;
                        totalSelected++;
                        totalAmount += r.amount;
                    }
                });
            });
            
            const syncBar = document.getElementById('syncBar');
            if (!syncBar) return;
            
            if (hasSelection) {
                syncBar.style.display = 'flex';
                document.getElementById('syncCount').textContent = totalSelected;
                document.getElementById('syncAmount').textContent = fmtMoney(totalAmount);
            } else {
                syncBar.style.display = 'none';
            }
        }

        function toggleSelectAll(id, type, checked) {
            const c = currentData.find(x => x._id === id);
            if (!c) return;
            const items = type === 'payments' ? c.oldContract.payments : c.oldContract.refunds;
            const selectedKey = type === 'payments' ? '_selectedPayments' : '_selectedRefunds';
            if (!c[selectedKey]) c[selectedKey] = {};
            items.forEach((_, i) => {
                c[selectedKey][i] = checked;
            });
            const card = document.querySelector(`.contract-card[data-id="${id}"]`);
            if (card) {
                const body = card.querySelector('.card-body');
                body.innerHTML = renderTabs(c) + renderSections(c);
            }
            updateSyncBar();
        }

        function toggleSelectItem(id, type, index, checked) {
            const c = currentData.find(x => x._id === id);
            if (!c) return;
            const selectedKey = type === 'payments' ? '_selectedPayments' : '_selectedRefunds';
            if (!c[selectedKey]) c[selectedKey] = {};
            c[selectedKey][index] = checked;
            const card = document.querySelector(`.contract-card[data-id="${id}"]`);
            if (card) {
                const body = card.querySelector('.card-body');
                body.innerHTML = renderTabs(c) + renderSections(c);
            }
            updateSyncBar();
        }

        function syncSelected(id, type) {
            const c = currentData.find(x => x._id === id);
            if (!c) return;
            const items = type === 'payments' ? c.oldContract.payments : c.oldContract.refunds;
            const selectedKey = type === 'payments' ? '_selectedPayments' : '_selectedRefunds';
            const selected = c[selectedKey] || {};
            const selectedItems = items.filter((_, i) => selected[i]);
            const selectedSum = selectedItems.reduce((s, item) => s + item.amount, 0);
            alert(`已选择 ${selectedItems.length} 笔${type === 'payments' ? '收款' : '退款'}记录，合计 ${fmtMoney(selectedSum)}\n\n这里可以调用同步接口，将选中的记录同步到新系统。`);
        }



        let demoMode = 1;

        function switchDemo(index) {
            demoMode = index;
            // 更新切换器样式
            document.querySelectorAll('.demo-item').forEach((el, i) => {
                const target = index === 'all' ? 'all' : i - 1;
                el.classList.toggle('active', demoMode === target);
            });
            // 更新数据
            if (demoMode === 'all') {
                currentData = [...mockContracts];
            } else {
                currentData = [mockContracts[demoMode]];
            }
            renderStats();
            renderList();
        }

        function toggleCard(id) {
            const c = currentData.find(x => x._id === id);
            if (!c) return;
            c._expanded = !c._expanded;
            const body = document.getElementById(`body-${id}`);
            const btn = document.getElementById(`toggle-${id}`);
            if (body) body.classList.toggle('expanded', c._expanded);
            if (btn) btn.classList.toggle('expanded', c._expanded);
        }

        function switchTab(id, tab) {
            const c = currentData.find(x => x._id === id);
            if (!c) return;
            c._tab = tab;
            const card = document.querySelector(`.contract-card[data-id="${id}"]`);
            if (!card) return;
            const body = card.querySelector('.card-body');
            body.innerHTML = renderTabs(c) + renderSections(c);
        }

        function applyFilter() {
            const ft = document.getElementById('filterTicket').value.trim().toLowerCase();
            const fc = document.getElementById('filterCustomer').value.trim().toLowerCase();
            const fn = document.getElementById('filterNanny').value.trim().toLowerCase();
            const fs = document.getElementById('filterStatus').value;
            const fd = document.getElementById('filterDiff').value;

            currentData = mockContracts.filter(c => {
                if (ft && !c.ticket.toLowerCase().includes(ft)) return false;
                if (fc && !c.customerName.includes(fc)) return false;
                if (fn && !c.nannyName.includes(fn)) return false;
                if (fs) {
                    const oldMatch = c.oldContract.status === fs;
                    const newMatch = c.newContract && c.newContract.status === fs;
                    if (!oldMatch && !newMatch) return false;
                }
                if (fd === 'has' && !c._diff.hasDiff) return false;
                if (fd === 'no' && c._diff.hasDiff) return false;
                return true;
            });
            renderStats();
            renderList();
        }

        function resetFilter() {
            document.getElementById('filterTicket').value = '';
            document.getElementById('filterCustomer').value = '';
            document.getElementById('filterNanny').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterDiff').value = '';
            currentData = [...mockContracts];
            renderStats();
            renderList();
        }

        ['filterTicket', 'filterCustomer', 'filterNanny'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') applyFilter();
            });
        });

        // 初始化：默认展示第2条示例数据（无合同有订单）
        currentData = [mockContracts[1]];
        renderStats();
        renderList();
    </script>
    
    <!-- 底部固定同步按钮栏 -->
    <div class="sync-bar" id="syncBar" style="display: none;">
        <div class="sync-bar-left">
            <div>已选 <b id="syncCount">0</b> 笔记录</div>
            <div>合计 <b id="syncAmount">¥0</b></div>
        </div>
        <button class="btn" onclick="confirmSync()">确认同步到新系统</button>
    </div>
    
    <script>
        function confirmSync() {
            let totalSelected = 0;
            let totalAmount = 0;
            let details = [];
            
            currentData.forEach(c => {
                const oldPayments = c.oldContract.payments || [];
                const oldRefunds = c.oldContract.refunds || [];
                const selPay = c._selectedPayments || {};
                const selRef = c._selectedRefunds || {};
                
                oldPayments.forEach((p, i) => {
                    if (selPay[i]) {
                        totalSelected++;
                        totalAmount += p.amount;
                        details.push(`收款: ${p.docNo} ${p.channel} ${fmtMoney(p.amount)}`);
                    }
                });
                oldRefunds.forEach((r, i) => {
                    if (selRef[i]) {
                        totalSelected++;
                        totalAmount += r.amount;
                        details.push(`退款: ${r.docNo} ${r.channel} ${fmtMoney(r.amount)}`);
                    }
                });
            });
            
            if (totalSelected === 0) {
                alert('请先选择要同步的记录');
                return;
            }
            
            const confirmMsg = `确认同步以下 ${totalSelected} 笔记录到新系统？\n\n合计金额: ${fmtMoney(totalAmount)}\n\n${details.join('\n')}\n\n同步后将在新系统订单中创建对应的收款/退款记录。`;
            
            if (confirm(confirmMsg)) {
                alert('同步成功！\n\n这里可以调用实际的同步接口。');
                // 清空选中状态
                currentData.forEach(c => {
                    c._selectedPayments = {};
                    c._selectedRefunds = {};
                });
                updateSyncBar();
                renderList();
            }
        }
    </script>
</body>
</html>
