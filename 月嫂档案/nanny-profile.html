<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.3/dist/index.css">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    /* ============ 页面级样式：月嫂档案单页 ============ */
    .src-note { font-size: 12px; color: #909399; font-weight: normal; }
    .pane-note { font-size: 12px; color: #909399; margin-bottom: 14px; }
    .sub-title { font-size: 14px; font-weight: 600; margin: 4px 0 12px; padding-left: 8px; border-left: 3px solid #409eff; }
    .sub-gap { margin-top: 20px; }
    .flaw-detail { padding: 10px 48px 10px 12px; background: #fafafa; }
    .el-table .row-highlight td { background: #fdf6ec !important; }

    /* ① 档案头概览卡 */
    .ph-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
    .ph-left { width: 200px; flex-shrink: 0; text-align: center; border-right: 1px solid #f0f0f0; padding-right: 20px; }
    .ph-avatar { width: 88px; height: 88px; border-radius: 50%; background: #ecf5ff; color: #409eff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
    .ph-name { font-size: 20px; font-weight: 600; color: #1f2d3d; }
    .ph-id { font-size: 12px; color: #909399; margin-top: 2px; }
    .ph-sub { font-size: 12px; color: #606266; margin-top: 8px; line-height: 1.9; }
    .ph-video { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .ph-mid { flex: 1; min-width: 400px; }
    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 20px; }
    .st-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1f2d3d; }
    .st-label { color: #909399; flex-shrink: 0; width: 72px; }
    .st-col { display: flex; flex-direction: column; gap: 12px; }
    .st-group { font-size: 12px; font-weight: 600; color: #909399; }
    .warn-text { color: #e6a23c; font-weight: 600; }
    .ph-photo { width: 96px; height: 72px; border-radius: 8px; border: 1px dashed #c0c4cc; background: #f8f9fb; color: #909399; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 12px; gap: 3px; }
    .ph-chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .ph-strip { margin-top: 14px; border-top: 1px dashed #e4e7ed; padding-top: 12px; }
    .ph-strip-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .alert-strip { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; padding: 8px 14px; background: #fdf6ec; border: 1px solid #faecd8; border-radius: 6px; font-size: 13px; }
    .as-item { display: inline-flex; align-items: center; gap: 5px; color: #b88230; }
    .photo-wall { display: flex; flex-wrap: wrap; gap: 8px; }
    .photo-item { position: relative; width: 88px; height: 66px; }
    .photo-thumb { width: 88px; height: 66px; border-radius: 6px; border: 1px solid #ebeef5; cursor: pointer; }
    .photo-cover { position: absolute; left: 0; top: 0; background: #409eff; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 6px 0 6px 0; }
    .level-badge { display: inline-block; background: linear-gradient(135deg, #b88230, #d4a017); color: #fff; font-weight: 700; border-radius: 6px; padding: 2px 12px; font-size: 14px; }
    .ph-right { width: 320px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
    .metric { background: #f8f9fb; border-radius: 6px; padding: 12px 6px; text-align: center; }
    .metric-v { font-size: 18px; font-weight: 600; color: #1f2d3d; }
    .metric-l { font-size: 12px; color: #909399; margin-top: 4px; }
    .q-icon { font-size: 13px; color: #c0c4cc; cursor: help; }
    .q-icon:hover { color: #409eff; }
    .metric-q { grid-column: 1 / -1; text-align: right; line-height: 1; margin-bottom: -4px; }

    /* 汇总 chips */
    .kv-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { background: #f8f9fb; border: 1px solid #ebeef5; border-radius: 6px; padding: 8px 14px; font-size: 13px; color: #606266; }
    .chip b { color: #1f2d3d; font-size: 15px; margin-left: 6px; }
    .chip-link { cursor: pointer; }
    .chip-link:hover { border-color: #409eff; }

    .m-free { color: #529b2e; } .m-book { color: #337ecc; } .m-lock { color: #b88230; } .m-leave { color: #722ed1; }
    .month-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
    .month-cell { background: #f8f9fb; border: 1px solid #ebeef5; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
    .month-cell:hover { border-color: #409eff; }

    /* 等单统计面板 */
    .idle-panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 16px; }
    .idle-panel { border: 1px solid #ebeef5; border-radius: 8px; padding: 10px 14px; background: #f8f9fb; }
    .ip-title { font-size: 12px; color: #909399; margin-bottom: 6px; }
    .ip-num { font-size: 13px; color: #606266; margin-bottom: 6px; }
    .ip-num b { font-size: 18px; color: #1f2d3d; margin: 0 2px; }
    .ip-den { font-size: 12px; color: #909399; }
    .ip-sub { font-size: 11px; color: #909399; margin-top: 4px; }
    .m-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #1f2d3d; }
    .m-body { font-size: 12px; line-height: 1.6; }
    .m-open { font-weight: 600; }

    /* 档期日历弹窗 */
    .cal-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .cal-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; text-align: center; color: #1f2d3d; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-head { font-size: 12px; color: #909399; text-align: center; padding: 4px 0; }
    .cal-cell { aspect-ratio: 1.4; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 4px; background: #f0f9eb; color: #529b2e; }
    .cal-cell.blank { background: transparent; }
    .cal-cell.locked { background: #fdf6ec; color: #b88230; font-weight: 600; }
    .cal-cell.booked { background: #ecf5ff; color: #337ecc; font-weight: 600; }
    .cal-cell.leave { background: #f4f0fa; color: #722ed1; font-weight: 600; }
    .cal-cell.today { box-shadow: inset 0 0 0 2px #f56c6c; }
    .cal-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: #606266; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .dot.free { background: #f0f9eb; border: 1px solid #b3e19d; }
    .dot.locked { background: #fdf6ec; border: 1px solid #eebe77; }
    .dot.booked { background: #ecf5ff; border: 1px solid #79bbff; }
    .dot.leave { background: #f4f0fa; border: 1px solid #b37feb; }
    .dot.today { background: #fff; border: 2px solid #f56c6c; }

    @media (max-width: 768px) {
      .ph-left { width: 100%; border-right: none; border-bottom: 1px solid #f0f0f0; padding: 0 0 16px; }
      .ph-mid { min-width: 0; }
      .status-grid { grid-template-columns: 1fr; }
      .ph-right { width: 100%; }
      .month-grid { grid-template-columns: repeat(2, 1fr); }
    }

</head>

              <div class="ph-wrap">
                <div class="ph-left">
                  <div class="ph-photo"><el-icon :size="24"><Picture /></el-icon><span>头图</span></div>
                  <div class="ph-name">李秀珍</div>
                  <div class="ph-id">YG-1023</div>
                  <div class="ph-sub">42 岁 · 湖南邵阳<br>现居 广东深圳 · 龙岗</div>
                  <div class="ph-video">
                    <el-tag type="success" effect="dark" size="small" style="cursor:pointer" @click.stop="noop('在线播放形象视频')"><el-icon style="margin-right:4px"><VideoPlay /></el-icon>形象视频 · 已上传 · 点击播放</el-tag>

                    <el-tag size="small" effect="plain">龙岗</el-tag>
                    <el-tag size="small" effect="plain">宝安</el-tag>
                    <el-tag size="small" effect="plain">南山</el-tag>
                    <el-tag size="small" effect="plain" type="info">住家 24h</el-tag>
                  </div>
                </div>
                <div class="ph-mid">
                  <div class="status-grid">
                    <div class="st-col">
                      <div class="st-group">身份</div>
                      <div class="st-item"><span class="st-label">类别</span><el-tag size="small" type="primary" effect="plain">签约月嫂</el-tag></div>

            </div>
          </div>

          <!-- ②~⑨ 分区 Tab（编号与字段清单区块一一对应；?tab= 可指定默认激活） -->

                    <el-descriptions-item label="联系方式">138****6621</el-descriptions-item>
