<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单变更审核弹窗 · 原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f2f2f5;color:#333;font-size:14px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal{background:#f8f7fb;border-radius:10px;width:560px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden}

  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#e8e6f2}
  .modal-head h2{font-size:18px;font-weight:600;color:#3d3d4d}
  .modal-close{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#8f8f9a;cursor:pointer;font-size:18px}
  .modal-close:hover{color:#e5484d}

  .modal-body{padding:22px 24px 18px}

  /* 审核提示 */
  .audit-tip{background:#fff7d6;border:1px solid #f2df9a;border-radius:6px;padding:12px 14px;margin-bottom:18px;color:#7a5c0b;font-size:13px;line-height:1.7}
  .audit-tip b{font-weight:600;color:#5a4508}
  .audit-tip ul{margin:6px 0 0 18px}
  .audit-tip li{margin-bottom:2px}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-bottom:18px}
  .info-item{display:flex;flex-direction:column;gap:3px}
  .info-label{color:#8f8f9a;font-size:12px}
  .info-value{font-size:14px;color:#26262e}
  .info-value.money{font-size:16px;font-weight:600;color:#d6336c}
  .info-value.mono{font-family:Roboto,Menlo,monospace}

  .tag{display:inline-block;width:max-content;font-size:12px;padding:2px 10px;border-radius:4px}
  .tag-wait{background:#fff7d6;border:1px solid #f2df9a;color:#7a5c0b}

  .full-item{grid-column:1/-1}
  .summary-line{background:#fff;border:1px solid #e3e6ee;border-radius:6px;padding:12px 14px;color:#4a4a55;font-size:13px;line-height:1.7}

  .section{margin-bottom:18px}
  .section-title{font-size:13px;color:#8f8f9a;margin-bottom:6px}
  .section-content{font-size:14px;color:#26262e}
  .note-box{background:#fff;border:1px solid #e3e6ee;border-radius:6px;padding:12px 14px;color:#4a4a55}

  .textarea{width:100%;min-height:80px;padding:12px 14px;border:1px solid #d8dbe4;border-radius:6px;resize:vertical;font-size:14px;color:#26262e;outline:none;background:#fff}
  .textarea:focus{border-color:#8b30e6;box-shadow:0 0 0 2px rgba(139,48,230,.12)}

  .modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:14px 24px 22px}
  .btn{padding:8px 22px;border-radius:6px;font-size:14px;cursor:pointer;border:1px solid transparent}
  .btn-cancel{background:#fff;border-color:#d8dbe4;color:#4a4a55}
  .btn-cancel:hover{background:#f8f7fb}
  .btn-reject{background:#e5484d;color:#fff;border-color:#e5484d}
  .btn-reject:hover{background:#d63a3f}
  .btn-pass{background:#8b30e6;color:#fff;border-color:#8b30e6}
  .btn-pass:hover{background:#7a26cc}

  @media (max-width:600px){
    .info-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>审核</h2>
      <span class="modal-close">×</span>
    </div>

    <div class="modal-body">
      <!-- 联动规则提示：让审核人明确知道决策会同步影响关联退款单 -->
      <div class="audit-tip">
        <b>审核提示</b>：本次订单变更关联 <b>1</b> 笔退款审批单（¥13,248）。<br>
        订单变更审核结果将同步决定关联退款审批单：
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">工单号</span>
          <span class="info-value mono">YGCR2607300842284090362</span>
        </div>
        <div class="info-item">
          <span class="info-label">客户</span>
          <span class="info-value">韦舒洁</span>
        </div>
        <div class="info-item">
          <span class="info-label">手机号</span>
          <span class="info-value mono">16675115456</span>
        </div>
        <div class="info-item">
          <span class="info-label">当前状态</span>
          <span class="tag tag-wait">待会计审核</span>
        </div>
        <div class="info-item">
          <span class="info-label">退款金额</span>
          <span class="info-value money">¥13,248</span>
        </div>
        <div class="info-item">
          <span class="info-label">变更原因</span>
          <span class="info-value">提前结束服务</span>
        </div>
        <div class="info-item full-item">
          <span class="info-label">变更摘要</span>
          <div class="summary-line">
            服务天数：42 → 18；合同金额：23183.0000 → 9935
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">退款原因</div>
        <div class="section-content">提前结束服务</div>
      </div>

      <div class="section">
        <div class="section-title">附件预览</div>
        <div class="section-content" style="color:#8f8f9a">无附件</div>
      </div>

      <div class="section">
        <div class="section-title">退款备注</div>
        <div class="note-box">Y5/42天套餐，提前结束服务，服务时间合计18天</div>
      </div>

      <div class="section">
        <div class="section-title">审批意见</div>
        <textarea class="textarea" placeholder="可选填写审批意见"></textarea>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-cancel">取消</button>
      <button class="btn btn-reject">不通过</button>
      <button class="btn btn-pass">通过</button>
    </div>
  </div>
</div>
</body>
</html>
