<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单变更审核 · 后台原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f5f7fa;color:#26262e;font-size:14px;line-height:1.5}
  .page{max-width:1600px;margin:0 auto;padding:20px 24px 60px}
  .page-title{font-size:20px;font-weight:600;margin-bottom:18px}
  .card{background:#fff;border:1px solid #e3e6ee;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}

  /* 筛选栏 */
  .filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;margin-bottom:16px}
  .filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid #d8dbe4;border-radius:6px;font-size:13px;outline:none;color:#26262e;background:#fff}
  .filter-bar input:focus,.filter-bar select:focus{border-color:#8b30e6;box-shadow:0 0 0 2px rgba(139,48,230,.1)}
  .filter-bar .search{min-width:260px;flex:1}
  .filter-bar .date{width:150px}
  .filter-bar .actions{margin-left:auto;display:flex;gap:10px}
  .btn{padding:8px 18px;border:1px solid #d8dbe4;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;color:#4a4a55}
  .btn:hover{background:#f8f7fb}
  .btn-primary{background:#8b30e6;border-color:#8b30e6;color:#fff}
  .btn-primary:hover{background:#7a26cc}

  /* 表格 */
  .table-card{overflow:hidden}
  .table-scroll{overflow-x:auto}
  .data-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  .data-table th{color:#6a6a75;font-weight:500;text-align:left;padding:12px 10px;border-bottom:1px solid #eef0f5;background:#fafbfc}
  .data-table td{padding:14px 10px;border-bottom:1px solid #f2f3f7;vertical-align:top}
  .data-table tbody tr:not(.detail-row):hover{background:#fafbfc}
  .data-table tbody tr.expanded{background:#f8f9fb}
  .data-table .customer{display:flex;flex-direction:column;gap:2px}
  .data-table .customer .phone{color:#8f8f9a;font-size:12px}
  .data-table .remark{max-width:180px;overflow:hidden;text-overflow:ellipsis;color:#6a6a75}

  /* 标签 */
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;line-height:1.5}
  .tag-green{background:#e6f7ed;border:1px solid #b3e6c8;color:#1a7f3f}
  .tag-orange{background:#fff4e5;border:1px solid #ffd9a8;color:#c2730a}
  .tag-red{background:#fff0f0;border:1px solid #f6c6c8;color:#c92a2a}
  .tag-blue{background:#e6f0ff;border:1px solid #b3d1ff;color:#1a5fb4}
  .tag-gray{background:#f0f0f4;border:1px solid #e0e0e6;color:#6a6a75}

  .money{font-weight:600;font-family:Roboto,system-ui,sans-serif}
  .money.down{color:#d6336c}
  .money.up{color:#1a7f3f}

  /* 展开详情 */
  .detail-row{display:none;background:#fafbfc}
  .detail-row.open{display:table-row}
  .detail-cell{padding:20px 24px;border-bottom:1px solid #e3e6ee;white-space:normal}
  .detail-panel{display:flex;flex-direction:column;gap:18px}

  .section-title{font-size:15px;font-weight:600;color:#3d3d4d;margin-bottom:12px;padding-left:8px;border-left:3px solid #8b30e6}

  /* 信息卡片双栏 */
  .info-grid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,1.4fr);gap:18px}
  @media (max-width:1100px){.info-grid{grid-template-columns:1fr}}

  .info-card{border:1px solid #e9ebf2;border-radius:8px;padding:16px 18px;background:#fff}
  .info-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px 16px}
  .info-item{display:flex;flex-direction:column;gap:4px}
  .info-item.full{grid-column:1/-1}
  .info-label{color:#8f8f9a;font-size:12px}
  .info-value{font-size:14px;color:#26262e;word-break:break-all}
  .info-value.mono{font-family:Roboto,Menlo,monospace}

  .change-list{display:flex;flex-direction:column;gap:14px}
  .change-item{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
  .change-label{color:#8f8f9a;font-size:12px;min-width:100px;flex-shrink:0}
  .change-value{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  .old-val{color:#8f8f9a;text-decoration:line-through;overflow:hidden;text-overflow:ellipsis}
  .arrow{color:#b8bbca;font-size:12px;flex-shrink:0}
  .new-val{color:#1a5fb4;font-weight:600;overflow:hidden;text-overflow:ellipsis}

  /* 关联退款 */
  .refund-card{border:1px solid #e9ebf2;border-radius:8px;padding:16px 18px;background:#fff}
  .refund-empty{color:#8f8f9a;font-size:13px;padding:12px 0}
  .refund-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .refund-table th{font-weight:500;color:#6a6a75;text-align:left;padding:10px 8px;border-bottom:1px solid #eef0f5;background:#fafbfc}
  .refund-table td{padding:12px 8px;border-bottom:1px solid #f2f3f7;vertical-align:top}
  .refund-table tr:last-child td{border-bottom:none}

  /* 审核记录 */
  .timeline{position:relative;padding-left:20px}
  .timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:#e3e6ee}
  .timeline-item{position:relative;padding-bottom:14px}
  .timeline-item:last-child{padding-bottom:0}
  .timeline-item::before{content:'';position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #8b30e6}
  .timeline-item.done::before{background:#8b30e6;border-color:#8b30e6}
  .timeline-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .timeline-time{color:#8f8f9a;font-size:12px}
  .timeline-person{font-weight:600}
  .timeline-action{font-size:12px;color:#6a6a75}
  .timeline-next{font-size:12px;color:#8f8f9a;margin-top:2px}

  .op-btn{padding:4px 12px;border:1px solid #d8dbe4;border-radius:4px;background:#fff;font-size:12px;cursor:pointer;color:#4a4a55}
  .op-btn:hover{border-color:#8b30e6;color:#8b30e6}
  .op-btn.active{background:#f3e8fd;border-color:#8b30e6;color:#8b30e6}
</style>
</head>
<body>
<div class="page">
  <h1 class="page-title">订单变更审核</h1>

  <div class="filter-bar card">
    <input type="text" class="search" id="search" placeholder="搜索工单号/订单号/合同编号/客户名/手机号...">
    <select id="status">
      <option value="">全部状态</option>
      <option value="已通过" selected>已通过</option>

      <option value="已驳回">已驳回</option>
    </select>
    <input type="text" class="date" placeholder="提交时间 yyyy/mm/日">
    <span style="color:#b8bbca">~</span>
    <input type="text" class="date" placeholder="yyyy/mm/日">
    <div class="actions">
      <button class="btn btn-primary">查询</button>
      <button class="btn">重置</button>
    </div>
  </div>

  <div class="table-card card">
    <div class="table-scroll">
      <table class="data-table" id="auditTable">
        <thead>
          <tr>
            <th>提交时间</th>
            <th>客户</th>
            <th>变更前天数</th>
            <th>变更后天数</th>
            <th>变更前套餐金额</th>
            <th>变更后套餐金额</th>
            <th>变更前节日费用</th>
            <th>变更后节日费用</th>
            <th>变更金额</th>
            <th>变更类型</th>
            <th>变更原因</th>
            <th>备注</th>
            <th>退款金额</th>
            <th>状态</th>
            <th>提交人</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

function renderChangeVal(before, after, type='text'){
  const same = String(before) === String(after);
  const oldTxt = type==='money' ? fmtMoney(before) : before;
  const newTxt = type==='money' ? fmtMoney(after) : after;
  return `<div class="change-value">
    <span class="old-val" title="${oldTxt}">${oldTxt}</span>
    <span class="arrow">→</span>
    <span class="new-val" title="${newTxt}">${newTxt}</span>
  </div>`;
}

function renderTable(){
  const tbody = document.querySelector('#auditTable tbody');
  tbody.innerHTML = DATA.map(d => {
    const diffCls = d.changeAmount < 0 ? 'down' : (d.changeAmount > 0 ? 'up' : '');
    return `
      <tr class="data-row" data-id="${d.id}">
        <td>${d.submitTime}</td>
        <td><div class="customer"><span>${d.customer.name}</span><span class="phone">${fmtPhone(d.customer.phone)}</span></div></td>
        <td>${d.beforeDays}天</td>
        <td>${d.afterDays}天</td>
        <td class="money">${fmtMoney(d.beforePlanAmount)}</td>
        <td class="money">${fmtMoney(d.afterPlanAmount)}</td>
        <td class="money">${fmtMoney(d.beforeHoliday)}</td>
        <td class="money">${fmtMoney(d.afterHoliday)}</td>
        <td class="money ${diffCls}">${d.changeAmount > 0 ? '+' : ''}${fmtMoney(d.changeAmount)}</td>
        <td>${d.changeType}</td>
        <td>${d.reason}</td>
        <td><div class="remark" title="${d.remark}">${d.remark}</div></td>
        <td class="money">${d.refundAmount ? fmtMoney(d.refundAmount) : '-'}</td>
        <td><span class="tag ${STATUS_TAG[d.status] || 'tag-gray'}">${d.status}</span></td>
        <td>${d.submitter}</td>
        <td><button class="op-btn" data-id="${d.id}">审批记录</button></td>
      </tr>
      <tr class="detail-row" id="detail-${d.id}">
        <td colspan="16" class="detail-cell">
          ${renderDetail(d)}
        </td>
      </tr>
    `;
  }).join('');
}

function renderDetail(d){
  const o = d.orderInfo;
  const c = d.changeDetails;
  // 退款审核单状态与订单变更审核单联动：通过则全通过，驳回则全驳回，审核中则全审核中
  const refundAuditStatus = d.status === '已通过' ? '审核通过' : (d.status === '已驳回' ? '已驳回' : '审核中');
  const refundTotal = d.refunds.reduce((s, r) => s + r.amount, 0);
  const refundRows = d.refunds.length ? d.refunds.map(r => `
    <tr>
      <td class="mono">${r.payNo}</td>
      <td class="money">${fmtMoney(r.amount)}</td>
      <td><span class="tag ${AUDIT_STATUS_TAG[refundAuditStatus] || 'tag-gray'}">${refundAuditStatus}</span></td>
      <td><span class="tag ${PAY_STATUS_TAG[r.payStatus] || 'tag-gray'}">${r.payStatus}</span></td>
      <td>${r.reason}</td>
      <td style="white-space:normal;max-width:420px">${r.remark}</td>
    </tr>
  `).join('') : '';

  const auditRows = d.auditLog.map((log,i) => `
    <div class="timeline-item ${i === d.auditLog.length-1 ? '' : 'done'}">
      <div class="timeline-head">
        <span class="timeline-time">${log.time}</span>
        <span class="timeline-person">${log.person}</span>
        <span class="tag ${log.action==='提交'?'tag-gray':(log.action==='通过'?'tag-green':'tag-red')}">${log.action}</span>
        <span class="timeline-action">${log.status}</span>
      </div>
      ${log.next ? `<div class="timeline-next">下一步：${log.next}</div>` : ''}
    </div>
  `).join('');

  return `
    <div class="detail-panel">
      <div class="info-grid">
        <div class="info-card">
          <div class="section-title">订单信息</div>
          <div class="info-list">
            <div class="info-item"><span class="info-label">订单编号</span><span class="info-value mono">${o.orderNo}</span></div>
            <div class="info-item"><span class="info-label">工单号</span><span class="info-value mono">${o.workNo}</span></div>
            <div class="info-item"><span class="info-label">合同编号</span><span class="info-value mono">${o.contractNo}</span></div>
            <div class="info-item"><span class="info-label">手机号码</span><span class="info-value">${fmtPhone(o.phone)}</span></div>
            <div class="info-item"><span class="info-label">退款金额</span><span class="info-value money ${d.refundAmount?'down':''}">${d.refundAmount ? fmtMoney(d.refundAmount) : '-'}</span></div>
            <div class="info-item"><span class="info-label">变更原因</span><span class="info-value">${d.reason}</span></div>
            <div class="info-item full"><span class="info-label">变更备注</span><span class="info-value">${d.remark}</span></div>
          </div>
        </div>

        <div class="info-card">
          <div class="section-title">变更详情</div>
          <div class="change-list">
            <div class="change-item">
              <span class="change-label">服务套餐和等级</span>
              ${renderChangeVal(c.serviceLevelBefore, c.serviceLevelAfter)}
            </div>
            <div class="change-item">
              <span class="change-label">服务天数</span>
              ${renderChangeVal(c.daysBefore+'天', c.daysAfter+'天')}
            </div>
            <div class="change-item">
              <span class="change-label">套餐金额</span>
              ${renderChangeVal(c.planAmountBefore, c.planAmountAfter, 'money')}
            </div>
            <div class="change-item">
              <span class="change-label">节假日费</span>
              ${renderChangeVal(c.holidayBefore, c.holidayAfter, 'money')}
            </div>
            <div class="change-item">
              <span class="change-label">服务地址</span>
              ${renderChangeVal(c.addressBefore, c.addressAfter)}
            </div>
          </div>
        </div>
      </div>

      <div class="refund-card">
        <div class="section-title">关联退款</div>
        ${d.refunds.length ? `
          <table class="refund-table">
            <thead>
              <tr><th>退款支付单号</th><th>退款金额</th><th>审核状态</th><th>发放状态</th><th>退款原因</th><th>退款备注</th></tr>
            </thead>
            <tbody>${refundRows}
              <tr style="background:#fafbfc;font-weight:600">
                <td colspan="2" style="text-align:right">退款合计</td>
                <td colspan="4" class="money">${fmtMoney(refundTotal)}</td>
              </tr>
            </tbody>
          </table>
        ` : '<div class="refund-empty">该变更未关联退款</div>'}
      </div>

      <div class="info-card">
        <div class="section-title">审核记录</div>
        <div class="timeline">${auditRows}</div>
      </div>
    </div>
  `;
}

// 展开/收起详情
document.querySelector('#auditTable tbody').addEventListener('click', e => {
  const btn = e.target.closest('.op-btn');
  if(!btn) return;
  const id = btn.dataset.id;
  const detail = document.getElementById('detail-'+id);
  const row = document.querySelector(`.data-row[data-id="${id}"]`);
  const isOpen = detail.classList.contains('open');
  // 关闭全部
  document.querySelectorAll('.detail-row.open').forEach(r => r.classList.remove('open'));
  document.querySelectorAll('.data-row.expanded').forEach(r => r.classList.remove('expanded'));
  document.querySelectorAll('.op-btn').forEach(b => { b.classList.remove('active'); b.textContent = '审批记录'; });
  if(!isOpen){
    detail.classList.add('open');
    row.classList.add('expanded');
    btn.classList.add('active');
    btn.textContent = '收起记录';
  } else {
    btn.textContent = '审批记录';
  }
});

renderTable();
// 默认展开第一条（张丽蕊）
document.querySelector('.op-btn[data-id="R01"]').click();
</script>
</body>
</html>
