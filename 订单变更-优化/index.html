<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单变更优化 · 文档中心</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <!-- 右侧"本页目录"插件样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.3.2/dist/light.css">
  <style>
    /* 右侧目录标题（插件不渲染标题，用 CSS 补；容器是 aside.toc-nav） */
    aside.toc-nav::before {
      content: '本页目录';
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #2c3e50;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '订单变更优化 · 文档中心',
      loadSidebar: true,
      subMaxLevel: 0,   // 左侧只显示 _sidebar.md 导航，页面标题交给右侧目录
      auto2top: true,
      search: { placeholder: '搜索文档…', noData: '没有找到结果', depth: 3 },
      pagination: { previousText: '上一篇', nextText: '下一篇' },
      toc: { tocMaxLevel: 3, target: 'h2, h3' },   // 右侧本页目录
      plugins: [function (hook) {
        // 路由渲染前：把 mermaid 代码块换成 div.mermaid（docsify+mermaid 标准接法）
        hook.afterEach(function (html, next) {
          next(html.replace(
            /<pre[^>]*data-lang="mermaid"[^>]*><code[^>]*>([\s\S]*?)<\/code><\/pre>/g,
            '<div class="mermaid">$1</div>'
          ));
        });
        // 路由渲染后：执行 mermaid 渲染；失败时把错误信息显示到页面上便于排查
        hook.doneEach(function () {
          if (window.mermaid) {
            var dbg = document.querySelector('.markdown-section .mermaid');
            if (dbg) {
              var t = dbg.textContent;
              var i = t.indexOf('套餐变更生效');
              var pre = document.createElement('pre');
              pre.style.cssText = 'color:#06c;background:#eef;padding:8px;font-size:12px;white-space:pre-wrap;';
              pre.textContent = 'DEBUG mermaid 收到的文本: ' + JSON.stringify(t.slice(i, i + 40));
              document.querySelector('.markdown-section').appendChild(pre);
            }
            mermaid.run({ querySelector: '.markdown-section .mermaid' }).catch(function (err) {
              var d = document.createElement('pre');
              d.style.cssText = 'color:#c00;background:#fee;padding:12px;border-radius:8px;white-space:pre-wrap;';
              d.textContent = 'Mermaid 渲染失败：' + (err && (err.message || err.str) || err);
              document.querySelector('.markdown-section').appendChild(d);
            });
          }
        });
      }]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.3.2/dist/docsify-plugin-toc.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });</script>
</body>
</html>
